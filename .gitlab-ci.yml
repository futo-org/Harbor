  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/server.dockerfile"
      --destination "${CI_REGISTRY_IMAGE}"
  rules:
    - if: $CI_COMMIT_BRANCH == "production"

