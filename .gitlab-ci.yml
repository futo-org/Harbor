  needs: ["check", "build-web", "test"]
  rules:
    - if: $CI_COMMIT_BRANCH == "production"

push-server-image-production:
  stage: deploy
  needs: ["check", "build-server-release", "test"]
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
