---

variables:
  BUILDER_IMAGE: "${CI_REGISTRY_IMAGE}:builder"
  BUILDER_IMAGE_TAG: "${CI_REGISTRY_IMAGE}:builder-${CI_COMMIT_TAG}"
  POSTGRES_IMAGE: "postgres:14"
  SEARCH_IMAGE: "opensearchproject/opensearch:2.1.0"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  GIT_DEPTH: 1
  SCCACHE_DIR: ${CI_PROJECT_DIR}/.sccache
  RUSTC_WRAPPER: /opt/sccache/sccache
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest

default:
  tags:
    - dind

.npm-cache-config: &npm-cache-config
  key:
    files:
      - package-lock.json
  paths:
    - $npm_config_cache
  policy: pull

.rust-cache-config: &rust-cache-config
  key:
    files:
      - server/Cargo.toml
      - proto/protocol.proto
  paths:
    - ${CI_PROJECT_DIR}/.sccache/
    - ${CI_PROJECT_DIR}/.cargo/
  policy: pull-push

# .forum-server-cache-config: &forum-server-cache-config
#   key:
#     files:
#       - forum_server/Cargo.toml
#   paths:
#     - ${CI_PROJECT_DIR}/forum_server/.sqlx/
#   policy: pull-push

.rust-cache-build-config: &rust-cache-build-config
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ${CI_PROJECT_DIR}/server/target
    - ${CI_PROJECT_DIR}/polycentric-protocol/target
  policy: pull-push

.rust-cache-config-server: &rust-cache-config-server
  key:
    files:
      - server/Cargo.toml
      - proto/protocol.proto
  paths:
    - ${CI_PROJECT_DIR}/.sccache/
    - ${CI_PROJECT_DIR}/.cargo/
  policy: pull-push

.rust-cache-config-protocol: &rust-cache-config-protocol
  key:
    files:
      - polycentric-protocol/Cargo.toml
      - proto/protocol.proto
  paths:
    - ${CI_PROJECT_DIR}/.sccache/
    - ${CI_PROJECT_DIR}/.cargo/
  policy: pull-push

.rust-cache-build-protocol: &rust-cache-build-protocol
  key:
    files:
      - polycentric-protocol/Cargo.toml
      - proto/protocol.proto
  paths:
    - ${CI_PROJECT_DIR}/polycentric-protocol/target
  policy: pull-push

.rust-cache-build-server: &rust-cache-build-server
  key:
    files:
      - server/Cargo.toml
      - proto/protocol.proto
  paths:
    - ${CI_PROJECT_DIR}/server/target
  policy: pull-push

stages:
  - builder
  - check
  - format
  - build
  - lint
  - test
  - deploy

builder:
  stage: builder
  needs: []
  services:
    - name: gitlab.futo.org:5050/devops/manifest-repo/library/docker:dind
      command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false"]
      alias: docker
  script:
    - |
      timeout 30s /bin/sh -c 'until docker info > /dev/null; do
        echo "Waiting for docker to be ready..."
        sleep 1
      done'
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker buildx build --push -t "$BUILDER_IMAGE" -t "$BUILDER_IMAGE_TAG" .
  only:
    - tags

check:
  stage: check
  image: "$BUILDER_IMAGE"
  script: ./gitlab-ci/check-images.sh

deps:
  stage: check
  image: "$BUILDER_IMAGE"
  needs: []
  cache:
    - <<: *npm-cache-config
      policy: pull-push
  script:
    - npm ci
  artifacts:
    expire_in: 60 mins
    paths:
      - node_modules/
      - packages/*/node_modules/

format-server:
  stage: format
  image: "$BUILDER_IMAGE"
  script:
    - ./version.sh
    - cd server
    - cargo-fmt --check

# format-forum-server:
#   stage: format
#   script:
#     - ./version.sh
#     - cd forum_server
#     - cargo-fmt --check

format-protocol:
  stage: format
  image: "$BUILDER_IMAGE"
  script:
    - ./version.sh
    - cd polycentric-protocol
    - cargo-fmt --check

format-core:
  stage: format
  image: "$BUILDER_IMAGE"
  script:
    - ./version.sh
    - ./gitlab-ci/prettier-diff.sh ./packages/polycentric-core/src

format-react:
  stage: format
  image: "$BUILDER_IMAGE"
  script:
    - ./version.sh
    - ./gitlab-ci/prettier-diff.sh ./packages/polycentric-react/src

format-web:
  stage: format
  image: "$BUILDER_IMAGE"
  script:
    - ./version.sh
    - ./gitlab-ci/prettier-diff.sh ./packages/polycentric-web/src

format-desktop:
  stage: format
  image: "$BUILDER_IMAGE"
  script:
    - ./version.sh
    - ./gitlab-ci/prettier-diff.sh ./packages/polycentric-desktop/src
    - ./gitlab-ci/prettier-diff.sh ./packages/polycentric-desktop/electron

format-harbor:
  stage: format
  image: "$BUILDER_IMAGE"
  script:
    - ./version.sh
    - ./gitlab-ci/prettier-diff.sh ./packages/harbor-web/src

format-verifiers:
  stage: format
  image: "$BUILDER_IMAGE"
  script:
    - ./version.sh
    - ./gitlab-ci/prettier-diff.sh ./packages/verifiers/src

build-protocol:
  stage: build
  image: "$BUILDER_IMAGE"
  cache:
    - <<: *rust-cache-config
    - <<: *rust-cache-build-protocol
  script:
    - ./version.sh
    - cd polycentric-protocol
    - echo "Starting sccache server"
    - /opt/sccache/sccache --start-server || true
    - echo "Building protocol binary"
    - cargo build
    - echo "Running protocol tests"
    - cargo test
  needs: ["check"]
  artifacts:
      name: "artifacts"
      expire_in: 60 mins
      paths:
        - ./polycentric-protocol/target/release/polycentric-protocol

build-server:
  stage: build
  image: "$BUILDER_IMAGE"
  cache:
    - <<: *rust-cache-config-server
    - <<: *rust-cache-build-server
  script:
    - ./version.sh
    - mkdir build-artifacts
    - cd server
    - echo "Starting sccache server"
    - /opt/sccache/sccache --start-server || true
    - echo "Building server binary"
    - cargo build --locked
    - echo "Building test binary"
    - cargo test --no-run --frozen --locked &> out.txt
    - TEST_BIN=`cat out.txt | grep target/debug/deps/server | grep -oP '(?<=\()[^\)]+'`
    - echo "Test binary built at $TEST_BIN"
    - mv ./$TEST_BIN ../build-artifacts/server-test
    - mv ./target/debug/server ../build-artifacts/server
  needs: ["check"]
  artifacts:
      name: "artifacts"
      expire_in: 60 mins
      paths:
        - ./build-artifacts

