build-server-release:
  stage: build
  image: "$BUILDER_IMAGE"
  cache:
    - <<: *rust-cache-config-server
    - <<: *rust-cache-build-server
  script:
    - ./version.sh
    - cd server
    - echo "Starting sccache server"
    - /opt/sccache/sccache --start-server || true
    - cargo build --release
  needs: ["build-server"]
  artifacts:
      name: "artifacts"
      expire_in: 60 mins
      paths:
        - ./server/target/release/server
        - ./server/target/release/health_probe

build-core:
  stage: build
  image: "$BUILDER_IMAGE"
  needs: ["deps"]
  script:
    - ./version.sh
    - make proto
    - cd packages/polycentric-core
    - npm run build
  artifacts:
      name: "artifacts"
      expire_in: 60 mins
      paths:
        - ./packages/polycentric-core/dist/

build-react:
  stage: build
  image: "$BUILDER_IMAGE"
  script:
    - cd packages/polycentric-react && npm run build
  needs: ["deps", "build-core"]
  artifacts:
      name: "artifacts"
      expire_in: 60 mins
      paths:
        - ./packages/polycentric-react/dist/

build-leveldb:
  stage: build
  image: "$BUILDER_IMAGE"
  script:
    - cd packages/polycentric-leveldb && npm run build
  needs: ["deps", "build-core"]
  artifacts:
      name: "artifacts"
      expire_in: 60 mins
      paths:
        - ./packages/polycentric-leveldb/dist/

build-desktop:
  stage: build
  image: "$BUILDER_IMAGE"
  script:
    - cd packages/polycentric-desktop && npm run build
  needs: ["deps", "build-core", "build-react", "build-leveldb"]

build-web:
  stage: build
  image: "$BUILDER_IMAGE"
  script:
    - cd packages/polycentric-web && npm run build
  needs: ["deps", "build-react", "build-core"]
  artifacts:
      name: "artifacts"
      expire_in: 60 mins
      paths:
        - ./packages/polycentric-web/dist/

build-capacitor:
  stage: build
  image: "$BUILDER_IMAGE"
  script:
    - cd packages/polycentric-capacitor && npm run build
  needs: ["deps", "build-core", "build-react"]

build-harbor:
  stage: build
  image: "$BUILDER_IMAGE"
  script:
    - cd packages/harbor-web && npm run build
  needs: ["deps", "build-core"]

build-verifiers:
  stage: build
  image: "$BUILDER_IMAGE"
  script:
    - cd packages/verifiers && npm run build
  needs: ["deps", "build-core", "build-leveldb"]
  artifacts:
      name: "artifacts"
      expire_in: 60 mins
      paths:
        - ./packages/verifiers/dist/

lint-protocol:
  stage: lint
  image: "$BUILDER_IMAGE"
  cache:
    - <<: *rust-cache-config
    - <<: *rust-cache-build-protocol
  script:
    - ./version.sh
    - cd polycentric-protocol
    - cargo-clippy --no-deps -- -D warnings
  needs: ["build-protocol"]

lint-server:
  stage: lint
  image: "$BUILDER_IMAGE"
  cache:
    - <<: *rust-cache-config-server
    - <<: *rust-cache-build-server
  script:
    - ./version.sh
    - cd server
    - cargo-clippy --no-deps --locked -- -D warnings
  needs: ["build-server"]

