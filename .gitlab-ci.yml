include:
  - local: '.gitlab/ci/setup_images.yml'
  - local: '.gitlab/ci/build_rs_core.yml'
  - local: '.gitlab/ci/build_js_sdks.yml'
  - local: '.gitlab/ci/build_rn_sdk.yml'
  - local: '.gitlab/ci/build_services.yml'
  - local: '.gitlab/ci/build_app.yml'
  - local: '.gitlab/ci/build_docs.yml'
  - local: '.gitlab/ci/deploy_docs.yml'
  - local: '.gitlab/ci/deploy_app.yml'
  - local: '.gitlab/ci/deploy_services.yml'
  - local: '.gitlab/ci/deploy_pages.yml'
  - local: '.gitlab/ci/publish_charts.yml'
  - local: '.gitlab/ci/scan_dependencies.yml'
  - local: '.gitlab/ci/test_server.yml'
  - local: '.gitlab/ci/test_moderation.yml'
  - local: '.gitlab/ci/release.yml'
stages:
  - setup
  - check
  - build
  - test
  - publish
  - deploy
  - release
variables:
  GIT_DEPTH: 1
  # /harbor-cache is a host directory the runners bind-mount into every job
  # container (see runner config.toml), so these caches persist warm on the
  # runner host with no per-job archive/upload/download. Cargo, sccache and
  # the pnpm store are all safe for concurrent access (file locks /
  # content-addressable). On a runner without the mount the paths are just
  # container-local: everything still works, only cold.
  CARGO_HOME: /harbor-cache/cargo
  CARGO_TARGET_DIR: ${CI_PROJECT_DIR}/target
  SCCACHE_DIR: /harbor-cache/sccache
  # The one shared sccache dir holds dev+release+wasm+android objects; the
  # 10G default would thrash.
  SCCACHE_CACHE_SIZE: 30G
  # pnpm reads settings from npm_config_* environment variables.
  npm_config_store_dir: /harbor-cache/pnpm-store
  # CI builds are throwaway: incremental compilation only adds overhead and
  # bloats target dirs, and debuginfo is most of a dev target's size and a
  # large share of its compile time (test backtraces lose file/line info).
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Parallel archiver + cheapest compression: artifact save time is
  # dominated by CPU-bound compression, not upload.
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fast'
default:
  tags:
    - dind_fast
