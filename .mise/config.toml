[tools]
k3d = "5.9.0"
kubectl = "1.37.1"
helm = "4.3.0"
tilt = "0.37.8"
# Node from .nvmrc; pnpm matches package.json.
pnpm = "12.16.1"
# For the rs-core wasm build; pinned as in the Dockerfiles, CI and Cargo.lock.
rust = { version = "1.99.1", targets = "wasm32-unknown-unknown" }
protoc = "21.12"
"cargo:wasm-bindgen-cli" = "0.2.130"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[tasks.dev]
description = "Bring the cluster and stack up in Tilt; run the JS dev servers in another tab with `mise js`"
depends = ["k3d:up"]
# Tilt's UI needs the TTY.
raw = true
run = 'mise run tilt:up'

[tasks."js:install"]
description = "Install the JS workspace"
run = 'pnpm install'
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "patches/*"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks."js:build"]
description = "Build every package (Turbo-cached); the dev servers need their deps' dist/"
depends = ["js:install"]
run = 'pnpm build'

[tasks."js:dev"]
description = "Build the JS workspace and run its dev servers with turbo, less the services Tilt runs"
alias = "js"
depends = ["js:build"]
# turbo's UI needs the TTY.
raw = true
run = "pnpm dev --filter='!@polycentric/verifier-bot' --filter='!@polycentric/scraper'"

[tasks."k3d:up"]
description = "Create the local k3d cluster (context k3d-harbor)"
run = '''
k3d cluster get harbor >/dev/null 2>&1 || k3d cluster create --config deploy/local/k3d.yaml
kubectl --context k3d-harbor wait --for=condition=Ready nodes --all --timeout=120s
'''

[tasks."k3d:down"]
description = "Delete the local k3d cluster, and the moderation identity published to it"
run = '''
k3d cluster delete harbor
sed -i '/^HARBOR_MODERATION_\(IDENTITY\|SIGNING_KEY\)=/d' deploy/local/.env 2>/dev/null || true
'''

[tasks."tilt:up"]
description = "Deploy the stack to the k3d cluster; args after -- are the resources to run (default all)"
# Skips Docker Desktop's credential helper (flaky under WSL).
env = { DOCKER_CONFIG = "{{config_root}}/deploy/local/docker" }
raw = true
run = '''
pkill -f '^tilt up -f deploy/local/Tiltfile' && while pgrep -f '^tilt up -f deploy/local/Tiltfile' >/dev/null; do sleep 0.2; done
tilt up -f deploy/local/Tiltfile --context k3d-harbor -- "$@"
'''

[tasks."tilt:status"]
description = "Build and runtime status of each resource in the running stack"
run = '''tilt get uiresources -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.updateStatus}{"\t"}{.status.runtimeStatus}{"\n"}{end}' | sort | column -t'''

[tasks."tilt:down"]
description = "Remove the stack from the k3d cluster, and the moderation identity published to it"
run = '''
tilt down -f deploy/local/Tiltfile --context k3d-harbor --delete-namespaces -- "$@"
sed -i '/^HARBOR_MODERATION_\(IDENTITY\|SIGNING_KEY\)=/d' deploy/local/.env 2>/dev/null || true
'''
