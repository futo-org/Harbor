syntax = "proto3";
package polycentric.v2;


import "polycentric/v2/keypair.proto";

message Identity {
  // List of the currently-active rotation keys.
  // These keys can publish events, including identity events with updates made
  // to the identity document.
  repeated PublicKey rotation_keys = 1;

  // List of keys that are allowed to sign events (but not change the identity content).
  repeated PublicKey signing_keys = 2;

  // In order to retain valid events from a revoked keypair, we store their last known
  // signature for each collection the key participated in.
  repeated RevocationBound revocation_bounds = 3;

  // Preferred servers of this identity (where they push and pull from).
  // Absent means the identity has not configured a server list yet and
  // clients fall back to their defaults; present-but-empty is intentional.
  ServerList servers = 4;

  // Backup key for recovering an account with no active sessions.
  // Its only use is for producing recovery signatures.
  optional PublicKey recovery_key = 5;

  // Signature from the recovery key in the preceding identity document.
  // The content signed should be (identity_string, new_rotation_key).
  optional bytes recovery_signature = 6;
}

message ServerList {
  repeated string urls = 1;
}

message RevocationBound {
  // Key that is revoked
  PublicKey revoked_key = 1;
  // One target per collection `revoked_key` wrote in, anchoring proof
  // verification at that collection's head event.
  repeated EventProofTarget targets = 2;
}

// Per-collection target for verifying an EventProof.
message EventProofTarget {
  int32 collection = 1;
  // Event's signature; matched by `EventProof.target_signature`.
  bytes signature = 2;
  // Event's `previous_root` — the Merkle root proofs verify against.
  bytes root = 3;
  // Leaf count of the tree at `root` (the number of events the head's
  // signer was aware of when they signed it).
  uint64 leaf_count = 4;
}
