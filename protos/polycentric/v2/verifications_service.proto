syntax = "proto3";
package polycentric.v2;

import "polycentric/v2/event_key.proto";
import "polycentric/v2/events.proto";

// Separate from verifications.proto: that file is imported by content.proto,
// so importing events.proto (for EventBundle) there would be a cyclic import.

// A claim with the verification state around it, so lists can show each
// claim's verified status from a single response.
message VerificationClaimBundle {
  // The VerificationClaim event.
  EventBundle claim = 1;
  // VerificationTarget events published by the claim's owner — who has
  // been asked to verify.
  repeated EventBundle targets = 2;
  // VerificationVerify events. The verifying identity is each
  // event's own signer.
  repeated EventBundle verifies = 3;
}

message ListVerificationClaimsRequest {
  string claimed_by_identity = 1;
}

message ListVerificationClaimsResponse {
  repeated VerificationClaimBundle claim_bundles = 1;
}

message ListVerificationTargetsRequest {
  EventKey claim_event_key = 1;
}

message ListVerificationTargetsResponse {
  // VerificationTarget events for the claim, published by the claim's
  // owner — who has been asked to verify. Deleted targets are excluded.
  repeated EventBundle event_bundles = 1;
}

message ListVerificationVerifiesRequest {
  EventKey claim_event_key = 1;
}

message ListVerificationVerifiesResponse {
  // VerificationVerify events for the claim, excluding deleted ones.
  // The verifying identity is each event's own signer.
  repeated EventBundle event_bundles = 1;
}

message ListTargetedVerificationClaimsRequest {
  string target_identity = 1;
}

message ListTargetedVerificationClaimsResponse {
  // Claims whose owner targeted `target_identity` — the identity's inbox
  // of verification requests.
  repeated VerificationClaimBundle claim_bundles = 1;
}

service VerificationsService {
  // VerificationClaim events published by an identity, with each claim's
  // targets and verifies.
  rpc ListVerificationClaims(ListVerificationClaimsRequest) returns (ListVerificationClaimsResponse);
  // VerificationTarget events for a claim: who has been asked to verify.
  rpc ListVerificationTargets(ListVerificationTargetsRequest) returns (ListVerificationTargetsResponse);
  // VerificationVerify events for a claim: who has verified it.
  rpc ListVerificationVerifies(ListVerificationVerifiesRequest) returns (ListVerificationVerifiesResponse);
  // Claims whose owner asked `target_identity` for verification, with each
  // claim's targets and verifies.
  rpc ListTargetedVerificationClaims(ListTargetedVerificationClaimsRequest) returns (ListTargetedVerificationClaimsResponse);
}