syntax = "proto3";
package polycentric.v2;

import "polycentric/v2/common.proto";

/**
 * Every moderation RPC is authenticated by signed gRPC metadata. Four
 * metadata entries are all required:
 *   - polycentric-content-digest: `sha-256=:<base64(sha256(message))>:`
 *     over the encoded request message (body binding)
 *   - polycentric-signature-input: `v=<n>;created=<ms>;expires=<ms>;
 *     keyid=<identity hex>;nonce=<base64>`
 *   - polycentric-public-key: base64 of the signer's raw ed25519 key
 *   - polycentric-signature: base64 ed25519 signature
 * The signature covers a canonical base over the operation (the gRPC
 * method path), the server's own authority (anti-relay), the
 * content-digest header (body binding), and the signature-input line.
 * The server checks freshness, verifies the signature against the
 * public key, and confirms the key is one of `keyid`'s authorized keys
 * before dispatching.
 */

/**
 * IsModerator: no extra fields — the subject is the signer (`keyid`).
 */
message IsModeratorRequest {}

message IsModeratorResponse {
  bool is_moderator = 1;
}

/**
 * SetBanStatus: ban or unban an identity.
 */
message SetBanStatusRequest {
  // Identity key being banned or unbanned.
  string target_identity = 1;
  // Desired ban state: true to ban, false to unban.
  bool banned = 2;
}

message SetBanStatusResponse {}

/**
 * IsBanned: query whether an identity is banned.
 */
message IsBannedRequest {
  // Identity key being asked about.
  string target_identity = 1;
}

message IsBannedResponse {
  bool is_banned = 1;
}

/**
 * ListBans: paginated, optionally filtered list of banned identities.
 */
message ListBansRequest {
  // Max entries to return; the server clamps to its own bounds.
  optional uint32 limit = 1;
  // Opaque cursor from a previous response's `page_info.end_cursor`.
  optional string after = 2;
  // Case-insensitive prefix filter: keep only identities beginning with
  // this value.
  optional string query = 3;
}

message ListBansResponse {
  // Identity keys banned on this server, most recently banned first.
  repeated string banned_identities = 1;
  PageInfo page_info = 2;
}

/**
 * Identity APIs. Every method is authenticated by signed gRPC metadata
 * (see above); the signer is identified by the metadata `keyid` and must
 * be one of that identity's authorized keys.
 */
service IdentityService {
  // Returns whether the signer is a moderator on this server.
  rpc IsModerator(IsModeratorRequest) returns (IsModeratorResponse);
  // Bans or unbans an identity on this server. Requires the signer to be
  // a moderator.
  rpc SetBanStatus(SetBanStatusRequest) returns (SetBanStatusResponse);
  // Returns whether an identity is banned on this server. Requires the
  // signer to be a moderator.
  rpc IsBanned(IsBannedRequest) returns (IsBannedResponse);
  // Lists the identities banned on this server. Requires the signer to
  // be a moderator.
  rpc ListBans(ListBansRequest) returns (ListBansResponse);
}
