syntax = "proto3";
package polycentric.v2;

import "polycentric/v2/server.proto";

/**
 * Payload an identity signs to query whether it is a moderator.
 */
message IsModeratorBody {
  // The user's identity key.
  string identity = 1;
  // Client timestamp in unix milliseconds; must be within the server's
  // acceptable skew window.
  int64 timestamp = 2;
  // URL of the server the request is addressed to. The server rejects
  // requests addressed to other servers, so a server that receives one
  // cannot relay it elsewhere to expose the client's status.
  string server_url = 3;
}

message IsModeratorResponse {
  bool is_moderator = 1;
}

/**
 * Payload a moderator signs to ban or unban an identity.
 */
message SetBanStatusBody {
  // Identity key of the moderator issuing the action.
  string moderator_identity = 1;
  // Identity key being banned or unbanned.
  string target_identity = 2;
  // Client timestamp in unix milliseconds; must be within the server's
  // acceptable skew window.
  int64 timestamp = 3;
  // URL of the server the request is addressed to. The server rejects
  // requests addressed to other servers.
  string server_url = 4;
  // Desired ban state: true to ban, false to unban.
  bool banned = 5;
}

message SetBanStatusResponse {}

/**
 * Payload a moderator signs to query whether an identity is banned.
 */
message IsBannedBody {
  // Identity key of the moderator asking.
  string moderator_identity = 1;
  // Identity key being asked about.
  string target_identity = 2;
  // Client timestamp in unix milliseconds; must be within the server's
  // acceptable skew window.
  int64 timestamp = 3;
  // URL of the server the request is addressed to. The server rejects
  // requests addressed to other servers.
  string server_url = 4;
}

message IsBannedResponse {
  bool is_banned = 1;
}

/**
 * Payload a moderator signs to list the identities banned on a server.
 */
message ListBansBody {
  // Identity key of the moderator asking.
  string moderator_identity = 1;
  // Client timestamp in unix milliseconds; must be within the server's
  // acceptable skew window.
  int64 timestamp = 2;
  // URL of the server the request is addressed to. The server rejects
  // requests addressed to other servers.
  string server_url = 3;
}

message ListBansResponse {
  // Identity keys banned on this server.
  repeated string banned_identities = 1;
}

/**
 * Identity APIs.
 */
service IdentityService {
  // Returns whether an identity is a moderator on this server. This
  // endpoint expects a signed IsModeratorBody message, signed by one of
  // the identity's authorized keys.
  rpc IsModerator(SignedMessage) returns (IsModeratorResponse);
  // Bans or unbans an identity on this server. This endpoint expects a
  // signed SetBanStatusBody message, signed by one of the moderator's
  // authorized keys.
  rpc SetBanStatus(SignedMessage) returns (SetBanStatusResponse);
  // Returns whether an identity is banned on this server. This endpoint
  // expects a signed IsBannedBody message, signed by one of the
  // moderator's authorized keys.
  rpc IsBanned(SignedMessage) returns (IsBannedResponse);
  // Lists the identities banned on this server. This endpoint expects a
  // signed ListBansBody message, signed by one of the moderator's
  // authorized keys.
  rpc ListBans(SignedMessage) returns (ListBansResponse);
}
