syntax = "proto3";
package polycentric.v2;

import "polycentric/v2/common.proto";
import "polycentric/v2/server.proto";

/**
 * The signed envelope for every moderation request. Wrapped in a
 * SignedMessage; the server validates the signature, server binding,
 * freshness, and signer authorization centrally before decoding `body`.
 * Which endpoint the request is for is implied by the RPC it is sent to.
 */
message ModerationRequest {
  // Identity key of the moderator issuing the request; the signature
  // must be by one of its authorized keys.
  string moderator_identity = 1;
  // Client timestamp in unix milliseconds; must be within the server's
  // acceptable skew window.
  int64 timestamp = 2;
  // URL of the server the request is addressed to. The server rejects
  // requests addressed to other servers.
  string server_url = 3;
  // Serialized endpoint-specific request message (see below), or empty
  // where the endpoint needs no extra fields.
  bytes body = 4;
}

/**
 * IsModerator: no extra fields — the subject is `moderator_identity`.
 */
message IsModeratorRequest {}

message IsModeratorResponse {
  bool is_moderator = 1;
}

/**
 * SetBanStatus: ban or unban an identity.
 */
message SetBanStatusRequest {
  // Identity key being banned or unbanned.
  string target_identity = 1;
  // Desired ban state: true to ban, false to unban.
  bool banned = 2;
}

message SetBanStatusResponse {}

/**
 * IsBanned: query whether an identity is banned.
 */
message IsBannedRequest {
  // Identity key being asked about.
  string target_identity = 1;
}

message IsBannedResponse {
  bool is_banned = 1;
}

/**
 * ListBans: paginated, optionally filtered list of banned identities.
 */
message ListBansRequest {
  // Max entries to return; the server clamps to its own bounds.
  optional uint32 limit = 1;
  // Opaque cursor from a previous response's `page_info.end_cursor`.
  optional string after = 2;
  // Case-insensitive prefix filter: keep only identities beginning with
  // this value.
  optional string query = 3;
}

message ListBansResponse {
  // Identity keys banned on this server, most recently banned first.
  repeated string banned_identities = 1;
  PageInfo page_info = 2;
}

/**
 * Identity APIs. Every method takes a SignedMessage wrapping a
 * serialized ModerationRequest (and, in `body`, the serialized
 * endpoint-specific request), signed by one of `moderator_identity`'s
 * authorized keys.
 */
service IdentityService {
  // Returns whether `moderator_identity` is a moderator on this server.
  rpc IsModerator(SignedMessage) returns (IsModeratorResponse);
  // Bans or unbans an identity on this server. Requires the signer to be
  // a moderator.
  rpc SetBanStatus(SignedMessage) returns (SetBanStatusResponse);
  // Returns whether an identity is banned on this server. Requires the
  // signer to be a moderator.
  rpc IsBanned(SignedMessage) returns (IsBannedResponse);
  // Lists the identities banned on this server. Requires the signer to
  // be a moderator.
  rpc ListBans(SignedMessage) returns (ListBansResponse);
}
