syntax = "proto3";
package polycentric.v2;

import "polycentric/v2/event_key.proto";
import "polycentric/v2/media.proto";

// Calendar events and RSVPs

message CalendarEvent {
  // Any random id for this event
  string id = 1;
  string title = 2;
  optional string description = 3;
  // Start, in ms since the Unix epoch (UTC)
  uint64 start_at = 4;
  // End, in ms since the Unix epoch (UTC)
  optional uint64 end_at = 5;
  optional CalendarEventLocation location = 6;
  // Labels the creator / client applies themselves
  repeated string labels = 7;
  // start_at / end_at are UTC midnights. Show the date only
  bool all_day = 8;
  // Cover image
  optional ImageSet image = 9;
  // Display hint only. IANA timezone of the venue, e.g. "Europe/Lisbon"
  optional string timezone = 10;
  // Hosts. Can be empty. Anyone but the creator has to accept
  repeated string hosts = 11;
}

message CalendarEventLocation {
  // Venue or place name
  string name = 1;
  optional string address = 2;
  optional GeoPoint point = 3;
  // Join link for online events
  optional string url = 4;
}

message GeoPoint {
  // WGS84 degrees
  double latitude = 1;
  double longitude = 2;
}

enum CalendarEventRsvpStatus {
  CALENDAR_EVENT_RSVP_STATUS_UNSPECIFIED = 0;
  CALENDAR_EVENT_RSVP_STATUS_GOING = 1;
  CALENDAR_EVENT_RSVP_STATUS_MAYBE = 2;
  CALENDAR_EVENT_RSVP_STATUS_NOT_GOING = 3;
  // Accept hosting. Only counts if the event names the identity in `hosts`
  CALENDAR_EVENT_RSVP_STATUS_HOSTING = 4;
}

message CalendarEventRsvp {
  // Calendar event being responded to
  EventKey event_key = 1;
  CalendarEventRsvpStatus status = 2;
}
