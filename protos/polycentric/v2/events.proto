syntax = "proto3";
package polycentric.v2;

import "polycentric/v2/content.proto";
import "polycentric/v2/event_key.proto";
import "polycentric/v2/keypair.proto";

// Contains the sequences (of the same event collection) that the current KeyPair is aware of. 
// The order of the sequences is determined by the the keys listed 
message VectorClock {
  repeated uint64 sequence = 1;
}

// Event messages reference, but do not include, content
message Event {
  // Key for the event
  EventKey key = 1;

  // Reference to the sequence, of the Identity Collection (1), that holds the identity document
  uint64 identity_sequence = 2;

  // Vector clock
  VectorClock vector_clock = 3;

  // Signature of the previous event signed by the same key. Assists in creating
  // immutable collections.
  bytes previous_signature = 4;

  // Digest of the content
  ContentDigest content_digest = 6;

  // Timestamp, in milliseconds, of when the event was created
  uint64 created_at = 7;

  // RFC 6962 Merkle root over this signer's prior signatures in this collection
  // (leaf_count = key.sequence - 1). Lets later events attest to the writer's
  // history; consumed by EventProof for membership verification.
  bytes previous_root = 8;
}

message SignedEvent {
  // Signature of events_bytes below (not the Event message)
  bytes signature = 1;
  // Serialized representation of the Event message that is signed against
  bytes event_bytes = 2;
}

// Bundle of the SignedEvent and SerializedContent messages
// We use SerializedContent so that the checksum of the content
// can be verified
message EventBundle {
  SignedEvent signed_event = 1;
  optional SerializedContent serialized_content = 2;
  repeated EventProof event_proofs = 3;
}

// Merkle inclusion proof: the SignedEvent in this bundle is the leaf at
// `leaf_index` in the tree rooted at the `EventProofTarget` identified by
// `target_signature`.
message EventProof {
  bytes target_signature = 1;
  // Canonical position of this event in the target's tree.
  uint64 leaf_index = 2;
  // RFC 6962 audit path: sibling hashes from leaf toward root.
  repeated bytes audit_path = 3;
}

// Hints are additional events that the server provides that may be
// useful to the client and avoid additional network requests.
// For example, a reply to post event could return the root/parent posts along with the
// most recent profile event
message EventHint {
  EventBundle event_bundle = 1;
}

message ListEventsFilters {
  // Collection to filter events by
  optional int32 collection = 1;
  // Identity key to filter events by
  optional string identity = 2;
  // Filter events to those signed by this public key
  optional PublicKey signed_by = 3;
  // Return sequences greater than
  optional int64 sequence_gt = 4;
  // Return sequences less than
  optional int64 sequence_lt = 5;
}

message ListEventsRequest {
  // Filters
  optional ListEventsFilters filters = 1;
  // Max number of events to return
  optional int32 size = 2;
}

message ListEventsResponse {
  repeated EventBundle event_bundles = 1;
  repeated EventHint event_hints = 2;
}

message PutEventsRequest {
  repeated EventBundle event_bundles = 1;
}

message PutEventsResponse {}

// Sync between clients and servers
service EventSyncService {
  // Returns a list of events (with content) from the server
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // Add events (with content) from a client to the server
  rpc PutEvents(PutEventsRequest) returns (PutEventsResponse);
}
