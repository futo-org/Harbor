syntax = "proto3";
package polycentric.v2;

import "polycentric/v2/keypair.proto";

/**
 * Current version the server is running on.
 */
message ServerVersion {
    string version = 1;
}

/**
 * Relevant information about the current server, such as version, public endpoints, etc.
 */
message ServerInfo {
    ServerVersion version = 1;
    // URL used to resolve HTTP assets (blobs, images, etc), the server's
    // `CDN_URL` setting.
    string cdn_url = 2;
}

message GetServerInfoRequest {
}

message GetServerInfoResponse {
    ServerInfo server_info = 1;
}

service ServerService {
    // Returns relevant information about a server
    rpc GetInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
}

// Envelope for requests authenticated with a key pair instead of a bearer
// token.
message SignedMessage {
  // Signature by `public_key` over `message_bytes`.
  bytes signature = 1;
  // The serialized request message, e.g. a RegisterPushNotificationRequest.
  bytes message_bytes = 2;
  PublicKey public_key = 3;
}
