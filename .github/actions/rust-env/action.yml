name: rust-env
description: >-
  Cargo/sccache paths under the workspace plus the self-populating cargo
  cache. In container jobs the github.workspace expression is the host path,
  not the container mount, so the paths are resolved from $GITHUB_WORKSPACE
  at runtime.
inputs:
  cache-key:
    description: Per-job cache key prefix (mirrors the GitLab cargo-${CI_JOB_NAME} key)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
        echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.sccache" >> "$GITHUB_ENV"
    # Self-populating per job: the first run downloads and compiles
    # everything and uploads the result; every run after starts with warm
    # crate sources and sccache hits for unchanged crates.
    - uses: actions/cache@v6
      with:
        path: |
          .cargo/registry/index
          .cargo/registry/cache
          .cargo/git/db
          .sccache
        key: cargo-${{ inputs.cache-key }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-${{ inputs.cache-key }}-
