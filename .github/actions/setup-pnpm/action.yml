name: setup-pnpm
description: >-
  Node 24 + pnpm 10, optionally running pnpm install. No pnpm store cache:
  extracting the multi-GB store (~100k small files) takes longer than pnpm
  re-downloading the same packages.
inputs:
  install:
    description: Run pnpm install (set to 'false' when artifacts must be placed first)
    default: 'true'
  install-args:
    description: Extra arguments for pnpm install
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - shell: bash
      run: npm install -g pnpm@10
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install ${{ inputs.install-args }}
