name: Integration tests

# End-to-end tests against the full docker compose stack (PostgreSQL,
# RustFS, Kafka). Called from ci.yml after the CI images and service image
# builds. Runs in the rust-dind image against the runner's Docker daemon
# (GitHub mounts the Docker socket into job containers), so the compose
# stack and the network-connect logic in the scripts work as on GitLab.
# Each job gets its own runner VM, so the GitLab docker-compose-integration
# resource group is unnecessary here.

on:
  workflow_call:
    inputs:
      registry:
        type: string
        required: true
      server_integration:
        type: string
        default: 'false'
      moderation_integration:
        type: string
        default: 'false'

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  server-integration:
    if: inputs.server_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ inputs.registry }}:rust-dind
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-env
        with:
          cache-key: server-integration
      - run: .gitlab/ci/scripts/integration-server.sh --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-server-integration
          path: target/nextest/ci/junit.xml
          retention-days: 7

  moderation-integration-csam:
    if: inputs.moderation_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ inputs.registry }}:rust-dind
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-env
        with:
          cache-key: moderation-integration
      - run: .gitlab/ci/scripts/integration-moderation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-moderation-integration
          path: target/nextest/ci/junit.xml
          retention-days: 7
