name: CI images

# Builds the CI toolchain images (rust, rust-dind). Called by ci.yml as the
# first stage so every container job depends on the images existing; when the
# image is already in the registry and its Dockerfiles are unchanged, the
# jobs no-op in seconds. workflow_dispatch forces a rebuild.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      images_changed:
        description: Whether .gitlab/images/** changed (forces a rebuild)
        type: string
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  CI_RUNNER: &ci-runner harbor-ubuntu-default

jobs:
  rust:
    runs-on: *ci-runner
    steps:
      - id: meta
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' || inputs.images_changed == 'true' }}
        run: |
          if [ "$FORCE" != "true" ] && docker manifest inspect "${{ steps.meta.outputs.registry }}:rust" >/dev/null 2>&1; then
            echo "image exists and is unchanged; skipping build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 'true'
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.build == 'true'
        with:
          context: .gitlab/images/rust
          push: true
          tags: ${{ steps.meta.outputs.registry }}:rust
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry }}:rust
          cache-to: type=inline

  rust-android:
    needs: rust
    runs-on: *ci-runner
    steps:
      - id: meta
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' || inputs.images_changed == 'true' }}
        run: |
          if [ "$FORCE" != "true" ] && docker manifest inspect "${{ steps.meta.outputs.registry }}:rust-android" >/dev/null 2>&1; then
            echo "image exists and is unchanged; skipping build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 'true'
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.build == 'true'
        with:
          context: .gitlab/images/rust-android
          push: true
          build-args: RUST_IMAGE=${{ steps.meta.outputs.registry }}:rust
          tags: ${{ steps.meta.outputs.registry }}:rust-android
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry }}:rust-android
          cache-to: type=inline

  rust-dind:
    needs: rust
    runs-on: *ci-runner
    steps:
      - id: meta
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' || inputs.images_changed == 'true' }}
        run: |
          if [ "$FORCE" != "true" ] && docker manifest inspect "${{ steps.meta.outputs.registry }}:rust-dind" >/dev/null 2>&1; then
            echo "image exists and is unchanged; skipping build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 'true'
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.build == 'true'
        with:
          context: .gitlab/images/rust-dind
          push: true
          build-args: RUST_IMAGE=${{ steps.meta.outputs.registry }}:rust
          tags: ${{ steps.meta.outputs.registry }}:rust-dind
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry }}:rust-dind
          cache-to: type=inline
