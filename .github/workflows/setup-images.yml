name: CI images

# Builds the CI toolchain images (rust, rust-dind) used by the main CI
# workflow. Run manually (workflow_dispatch) once to bootstrap a new
# repository before the first CI run.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitlab/images/**'
      - '.github/workflows/setup-images.yml'
  push:
    branches: [develop]
    paths:
      - '.gitlab/images/**'
      - '.github/workflows/setup-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .gitlab/images/rust
          push: true
          tags: ${{ steps.meta.outputs.registry }}:rust
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry }}:rust
          cache-to: type=inline

  rust-dind:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .gitlab/images/rust-dind
          push: true
          build-args: RUST_IMAGE=${{ steps.meta.outputs.registry }}:rust
          tags: ${{ steps.meta.outputs.registry }}:rust-dind
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry }}:rust-dind
          cache-to: type=inline
