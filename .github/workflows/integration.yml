name: Integration tests

# End-to-end tests against the full docker compose stack (PostgreSQL,
# RustFS, Kafka). Runs in the rust-dind image against the runner's Docker
# daemon (GitHub mounts the Docker socket into job containers), so the
# compose stack and the network-connect logic in the scripts work as on
# GitLab. Each job gets its own runner VM, so the GitLab
# docker-compose-integration resource group is unnecessary here.

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      server_integration: ${{ steps.filter.outputs.server_integration }}
      moderation_integration: ${{ steps.filter.outputs.moderation_integration }}
    steps:
      - id: meta
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/filters.yml

  server-integration:
    needs: changes
    if: needs.changes.outputs.server_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.changes.outputs.registry }}:rust-dind
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-env
        with:
          cache-key: server-integration
      - run: .gitlab/ci/scripts/integration-server.sh --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-server-integration
          path: target/nextest/ci/junit.xml
          retention-days: 7

  moderation-integration-csam:
    needs: changes
    if: needs.changes.outputs.moderation_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.changes.outputs.registry }}:rust-dind
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-env
        with:
          cache-key: moderation-integration
      - run: .gitlab/ci/scripts/integration-moderation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-moderation-integration
          path: target/nextest/ci/junit.xml
          retention-days: 7
