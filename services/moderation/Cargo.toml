[package]
edition      = "2024"
name         = "moderation-service"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[dependencies]
# Workspace
polycentric-core = { path = "../../packages/rs-core" }
polycentric-common.workspace = true
common-dotenv = { path = "../common/dotenv" }
common-kafka = { path = "../common/kafka" }
common-telemetry = { path = "../common/telemetry" }
common-object-store = { path = "../common/object-store" }
moderation-migration = { path = "./migration" }
moderation-entity = { path = "./entity" }

# 3rd Party
log.workspace = true
opentelemetry.workspace = true
tracing.workspace = true
prost.workspace = true
time.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
base64.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
serde_json = "1"
sea-orm = { workspace = true, features = ["sqlx-postgres", "runtime-tokio"] }
tokio = { workspace = true, features = ["full"] }