[package]
name = "server"
version = "0.0.1"
edition = "2024"

[dependencies]
# Workspace
common-dotenv = { path = "../common/dotenv" }
common-kafka = { path = "../common/kafka" }
common-object-store = { path = "../common/object-store" }
common-telemetry = { path = "../common/telemetry" }
entity = { path = "./entity" }
migration = { path = "./migration" }

# 3rd Party
axum = { version = "0.8.8", features = ["http2"] }
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
log.workspace = true
polycentric-common.workspace = true
prost.workspace = true
prost-types.workspace = true
rdkafka = { workspace = true, features = ["cmake-build", "curl", "sasl"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
sea-orm = { workspace = true, features = [ "sqlx-postgres", "runtime-tokio", "macros", "mock" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true, features = ["router", "transport"] }
tonic-prost.workspace = true
tonic-reflection = "0.14"
tonic-web = "0.14"
tracing.workspace = true
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", features = ["cors"] }
tower-layer = "0.3"
http = "1"
http-body-util = "0.1"

[dev-dependencies]
bytes = "1"
mockito = "1"
tonic-prost-build = "*"
tower = { version = "0.5", features = ["util"] }
