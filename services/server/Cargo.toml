[package]
name = "server"
version = "0.0.1"
edition = "2024"

[dependencies]
# Workspace
common-dotenv = { path = "../common/dotenv" }
common-kafka = { path = "../common/kafka" }
common-object-store = { path = "../common/object-store" }
entity = { path = "./entity" }
migration = { path = "./migration" }

# 3rd Party
axum = { version = "0.8.8", features = ["http2"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2.2.0"
expo_push_notification_client = "2.0.1"
log = "0.4"
polycentric-common = { path = "../../packages/rs-common" }
prost = "0.14"
prost-types = "0.14"
rdkafka = { workspace = true, features = ["cmake-build", "curl", "sasl"] }
sea-orm = { workspace = true, features = [ "sqlx-postgres", "runtime-tokio", "macros", "mock" ] }
sha2 = "0.10"
time = "0.3"
tokio = { workspace = true, features = ["full"] }
tonic = "*"
tonic-prost = "*"
tonic-reflection = "*"
tonic-web = "*"
tower-http = { version = "*", features = ["cors"] }
tower-layer = "*"
http = "*"

