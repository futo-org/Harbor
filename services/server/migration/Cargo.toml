[package]
edition      = "2024"
name         = "migration"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
entity = { path = "../entity" }
polycentric-common.workspace = true
prost.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[dependencies.sea-orm-migration]
workspace = true
features = [ "sqlx-postgres", "runtime-tokio" ]
