packages:
  - apps/*
  - packages/*
  - packages/js-browser/examples/*
  - packages/js-node/examples/*
  - services/scraper
  - services/verifier-bot
  - tools/*
  - docs/

catalog:
  "@noble/curves": ^2.2.0
  "@noble/hashes": ^2.2.0
  puppeteer: ^25.1.0
  "@types/jest": ^29.5.14
  "@types/node": ^24.0.0
  "@ubjs/core": 0.31.0-3
  jest: ^29.7.0
  jest-junit: ^17.0.0
  typescript: ^5.9.3
  uniffi-bindgen-react-native: 0.31.0-3

linkWorkspacePackages: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - react-native-screens

onlyBuiltDependencies:
  - better-sqlite3

overrides:
  serialize-javascript@<7.0.5: ">=7.0.5"
  uuid@<11.1.1: ">=11.1.1"
  websocket-driver@<0.7.5: ">=0.7.5"

patchedDependencies:
  "@expo/cli": patches/@expo__cli.patch
  "@rn-primitives/hooks@1.5.2": patches/@rn-primitives__hooks@1.5.2.patch
  uniffi-bindgen-react-native@0.31.0-3: patches/uniffi-bindgen-react-native@0.31.0-3.patch
