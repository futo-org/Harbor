packages:
  - apps/*
  - packages/*
  - packages/js-browser/examples/*
  - packages/js-node/examples/*
  - services/scraper
  - services/verifier-bot
  - tools/*
  - docs/
  - e2e

catalog:
  "@noble/curves": ^2.2.0
  "@noble/hashes": ^2.2.0
  puppeteer: ^25.1.0
  "@types/jest": ^30.0.0
  "@types/node": ^24.19.2
  "@ubjs/core": 0.31.0-6
  "@ubjs/wasm": 0.31.0-6
  jest: ^30.5.2
  jest-junit: ^17.0.0
  prom-client: ^15.1.3
  typescript: ^5.9.3
  uniffi-bindgen-react-native: 0.31.0-6

linkWorkspacePackages: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - react-native-screens
  - maestro-runner
  - "@devicelab/*"
  # Expo 58.0.20 set, until it clears the 1-day bar (2026-10-28 ~16:12 UTC)
  - "expo@58.0.20"
  - "expo-dev-client@58.0.16"
  - "expo-router@58.0.27"
  - "expo-modules-core@58.0.27"
  - "@expo/cli@58.1.16"
  - "babel-preset-expo@58.0.21"
  - "expo-dev-launcher@58.0.16"

allowBuilds:
  '@browserless/goto': false
  '@bufbuild/buf': false
  '@parcel/watcher': false
  '@swc/core': false
  better-sqlite3: true
  core-js: false
  esbuild: false
  html-get: false
  puppeteer: false
  re2: false
  unrs-resolver: false

overrides:
  dompurify@<3.4.17: ">=3.4.17"
  proxy-addr@<2.0.8: ">=2.0.8"
  serialize-javascript@<7.0.5: ">=7.0.5"
  shell-quote@<1.11.0: ">=1.11.0"
  tinypool@<2.1.2: ">=2.1.2"
  uuid@<11.1.1: ">=11.1.1"
  websocket-driver@<0.7.5: ">=0.7.5"

patchedDependencies:
  '@bsky.app/react-native-uitextview@2.7.1': patches/@bsky.app__react-native-uitextview@2.7.1.patch
  "@rn-primitives/hooks@1.5.2": patches/@rn-primitives__hooks@1.5.2.patch
