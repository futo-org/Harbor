packages:
  - apps/*
  - packages/*
  - packages/js-browser/examples/*
  - packages/js-node/examples/*
  - services/scraper
  - services/verifier-bot
  - tools/*
  - docs/
  - e2e

catalog:
  "@noble/curves": ^2.2.0
  "@noble/hashes": ^2.2.0
  puppeteer: ^25.1.0
  "@types/jest": ^29.5.14
  "@types/node": ^24.19.2
  "@ubjs/core": 0.31.0-5
  "@ubjs/wasm": 0.31.0-5
  jest: ^29.7.0
  jest-junit: ^17.0.0
  prom-client: ^15.1.3
  typescript: ^7.0.0
  uniffi-bindgen-react-native: 0.31.0-5

linkWorkspacePackages: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - react-native-screens
  - maestro-runner
  - "@devicelab/*"

allowBuilds:
  '@browserless/goto': false
  '@bufbuild/buf': false
  '@swc/core': false
  better-sqlite3: true
  core-js: false
  esbuild: false
  html-get: false
  puppeteer: false
  re2: false

overrides:
  dompurify@<3.4.17: ">=3.4.17"
  proxy-addr@<2.0.8: ">=2.0.8"
  serialize-javascript@<7.0.5: ">=7.0.5"
  shell-quote@<1.11.0: ">=1.11.0"
  tinypool@<2.1.2: ">=2.1.2"
  uuid@<11.1.1: ">=11.1.1"
  websocket-driver@<0.7.5: ">=0.7.5"

patchedDependencies:
  "@expo/cli": patches/@expo__cli.patch
  "@expo/ui": patches/@expo__ui.patch
  "@rn-primitives/hooks@1.5.2": patches/@rn-primitives__hooks@1.5.2.patch
  uniffi-bindgen-react-native@0.31.0-5: patches/uniffi-bindgen-react-native@0.31.0-5.patch
