.charts-workflow:
  image:
    name: alpine/helm:3.17.3
    entrypoint: ['']
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deploy/charts/**/*
        - .gitlab/ci/publish_charts.yml
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
        - Cargo.toml
        - Cargo.lock
        - services/server/**/*
        - services/common/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - deploy/charts/**/*
        - .gitlab/ci/publish_charts.yml
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
        - Cargo.toml
        - Cargo.lock
        - services/server/**/*
        - services/common/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml

charts-lint:
  extends: .charts-workflow
  stage: check
  script:
    - |
      for chart in deploy/charts/*/; do
        helm lint "$chart"
        helm template "$(basename "$chart")" "$chart" > /dev/null
      done

charts-publish:
  extends: .charts-workflow
  stage: publish
  before_script:
    - apk add --no-cache curl jq crane
  script:
    - echo "$CI_REGISTRY_PASSWORD" | helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - |
      latest=$(curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases?per_page=1" \
        | jq -r '.[0].tag_name // "0.0.0"') || latest=""
      [ -n "$latest" ] || latest="0.0.0"
      core=${latest#v}; core=${core%%-*}
      oldIFS=$IFS; IFS=.; set -- $core; IFS=$oldIFS
      # The short SHA makes the version unique per commit — helm-controller
      # runs with DisableChartDigestTracking, so only a version change (not a
      # re-push of the same version) triggers an upgrade.
      version="${1:-0}.${2:-0}.$(( ${3:-0} + 1 ))-${CI_COMMIT_REF_SLUG}.${CI_COMMIT_SHORT_SHA}"
      echo "Publishing charts as version ${version}"
      for chart in deploy/charts/*/; do
        name=$(basename "$chart")
        # appVersion pins image tags to the image built from this commit.
        helm package "$chart" --version "$version" --app-version "$CI_COMMIT_SHA" --destination packaged
        helm push "packaged/${name}-${version}.tgz" "oci://$CI_REGISTRY_IMAGE/charts"
        crane tag "$CI_REGISTRY_IMAGE/charts/${name}:${version}" "$CI_COMMIT_REF_SLUG"
      done
      # Hand the version to the deploy jobs (they re-tag charts per environment).
      echo "CHART_VERSION=${version}" > charts.env
  artifacts:
    reports:
      dotenv: charts.env
