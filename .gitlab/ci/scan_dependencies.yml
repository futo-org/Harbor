trivy:
  stage: test
  image:
    name: aquasec/trivy:0.69.3
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  allow_failure: true
  script:
    # Build report for GitLab UI
    - trivy fs --scanners vuln --format template --template "@/contrib/gitlab.tpl" -o gl-dependency-scanning-report.json .
    # Print report to job log
    - trivy fs --scanners vuln --exit-code 0 --severity HIGH,CRITICAL .
  cache:
    paths:
      - .trivycache/
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json