# Compile caching comes from the runner-mounted /harbor-cache (CARGO_HOME +
# SCCACHE_DIR, set globally in .gitlab-ci.yml) — no GitLab cache: blocks.
.service-rust-base:
  image: ${RUST_IMAGE}
  stage: check
  before_script:
    - command -v sccache >/dev/null && export RUSTC_WRAPPER=sccache || true

.service-format-check:
  extends: .service-rust-base
  script:
    - cargo fmt --check --package ${SERVICE_NAME}
  allow_failure: true

.service-clippy:
  extends: .service-rust-base
  script:
    - cargo clippy --package ${SERVICE_NAME} -- -D warnings
  allow_failure: true

.service-test:
  extends: .service-rust-base
  script:
    - cargo nextest run -P ci --package ${SERVICE_NAME}
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml

.service-image:
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    # Persistent local layer cache on the runner-mounted /harbor-cache,
    # replacing registry import/export of multi-GB cache layers. Per
    # service because buildkitd takes an exclusive lock on its root dir —
    # each image job also carries a matching resource_group so two
    # pipelines never run the same service's image build concurrently.
    # --oci-worker-no-process-sandbox is the rootless image's default flag
    # and must be kept when overriding.
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --root /harbor-cache/buildkit/${SERVICE_NAME}
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  stage: build
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./services/${SERVICE_DIR} \
        --output type=image,name=$CI_REGISTRY_IMAGE/${SERVICE_NAME}:$CI_COMMIT_SHA,push=true

########################################################################
# server
########################################################################

.server-workflow:
  image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^server-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Cargo.toml
        - Cargo.lock
        - services/server/**/*
        - services/common/**/*
        # Charts pin this commit's image SHA (appVersion), so the image must
        # exist even for chart-only changes.
        - deploy/charts/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
        - Cargo.lock
        - services/server/**/*
        - services/common/**/*
        - deploy/charts/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
  variables:
    RUNNER_SCRIPT_TIMEOUT: 179m
    SERVICE_NAME: server
    SERVICE_DIR: server

server-format-check:
  extends:
    - .server-workflow
    - .service-format-check

server-clippy:
  extends:
    - .server-workflow
    - .service-clippy

server-image:
  extends:
    - .server-workflow
    - .service-image
  resource_group: server-image
  rules:
    - !reference [.server-workflow, rules]
    - !reference [.release-workflow, rules]

