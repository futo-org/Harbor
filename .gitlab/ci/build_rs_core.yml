.rs-core-workflow:
  image: $RUST_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^rs-core-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Cargo.toml
        - Cargo.lock
        - packages/rs-*/**/*
        - .gitlab/ci/build_rs_core.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
        - Cargo.lock
        - packages/rs-*/**/*
        - .gitlab/ci/build_rs_core.yml
  variables:
    RUST_CORE_PATH: packages/rs-core
  before_script:
    # Enable the compile cache only when the image provides sccache, so
    # pipelines still on an older rust image keep working. Cache persistence
    # comes from the runner-mounted /harbor-cache (see .gitlab-ci.yml).
    - command -v sccache >/dev/null && export RUSTC_WRAPPER=sccache || true

.rust-check:
  extends: .rs-core-workflow
  stage: check
  allow_failure: true

rs-core-format-check:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - just format-check

rs-core-clippy:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - just clippy

rs-core-tests:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - cargo nextest run -P ci
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml

rs-common-format-check:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo fmt --check

rs-common-clippy:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo clippy

rs-common-tests:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo nextest run -P ci
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml

# rs-core-build:
