.rs-core-workflow:
  image: $RUST_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^rs-core-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Cargo.toml
        - Cargo.lock
        - packages/rs-*/**/*
        - .gitlab/ci/build_rs_core.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
        - Cargo.lock
        - packages/rs-*/**/*
        - .gitlab/ci/build_rs_core.yml
  variables:
    RUST_CORE_PATH: packages/rs-core
  cache:
    - key: rs-core-cargo-deps-${CI_COMMIT_REF_SLUG}
      fallback_keys:
        - rs-core-cargo-deps-${CI_DEFAULT_BRANCH}
      paths:
        - .cargo/registry/index
        - .cargo/registry/cache
        - .cargo/git/db
    - key: rs-core-target-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      fallback_keys:
        - rs-core-target-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      paths:
        - target

.rust-check:
  extends: .rs-core-workflow
  stage: check
  allow_failure: true

rs-core-format-check:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - just format-check

rs-core-clippy:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - just clippy

rs-core-tests:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - just test

rs-common-format-check:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo fmt --check

rs-common-clippy:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo clippy

rs-common-tests:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo test

# rs-core-build:
