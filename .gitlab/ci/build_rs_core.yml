.rs-core-workflow:
  image:
    name: $RUST_IMAGE
    pull_policy: if-not-present
  rules:
    - if: $CI_COMMIT_TAG =~ /^rs-core-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Cargo.toml
        - Cargo.lock
        - packages/rs-*/**/*
        - .gitlab/ci/build_rs_core.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
        - Cargo.lock
        - packages/rs-*/**/*
        - .gitlab/ci/build_rs_core.yml
  variables:
    RUST_CORE_PATH: packages/rs-core
  cache:
    - key:
        files:
          - Cargo.lock
        prefix: cargo-deps
      paths:
        - .cargo/registry/index
        - .cargo/registry/cache
        - .cargo/git/db
      policy: pull

# Populates the shared cargo-deps cache; every other rust job consumes it
# with `policy: pull` and never re-uploads it. The cache key is the
# Cargo.lock hash, so the cache only needs (re)creating when the lockfile
# changes — this job is rules-scoped to exactly that.
cargo-deps-warmup:
  extends: .rs-core-workflow
  stage: setup
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Cargo.lock
        - .gitlab/ci/build_rs_core.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.lock
        - .gitlab/ci/build_rs_core.yml
  cache:
    - key:
        files:
          - Cargo.lock
        prefix: cargo-deps
      paths:
        - .cargo/registry/index
        - .cargo/registry/cache
        - .cargo/git/db
      policy: pull-push
  script:
    - cargo fetch

.rust-check:
  extends: .rs-core-workflow
  stage: check
  allow_failure: true

rs-core-format-check:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - just format-check

rs-core-clippy:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - just clippy

rs-core-tests:
  extends: .rust-check
  script:
    - cd packages/rs-core
    - just test

rs-common-format-check:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo fmt --check

rs-common-clippy:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo clippy

rs-common-tests:
  extends: .rust-check
  script:
    - cd packages/rs-common
    - cargo test

# rs-core-build:
