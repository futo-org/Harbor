#   stage: build
#   script:
#     - cargo build

# Build the uniffi-web package (wasm)
rs-core-uniffi-web-build:
  extends: .rs-core-workflow
  stage: build
  rules:
    - !reference [.rs-core-workflow, rules]
    - !reference [.js-sdk-workflow, rules]
    - !reference [.rn-sdk-workflow, rules]
    - !reference [.app-workflow, rules]
    - !reference [.release-workflow, rules]
  script:
    - cd packages/rs-core-uniffi-web
    - |
      rustup target add \
        wasm32-unknown-unknown
    - pnpm i
    - pnpm build --release
  artifacts:
    paths:
      - packages/rs-core-uniffi-web/dist
    expire_in: 1 week
