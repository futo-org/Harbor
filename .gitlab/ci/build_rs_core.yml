#   stage: build
#   script:
#     - cargo build

# Build the uniffi-web package (wasm)
rs-core-uniffi-web-build:
  extends: .rs-core-workflow
  stage: build
  rules:
    - !reference [.rs-core-workflow, rules]
    - !reference [.js-sdk-workflow, rules]
    - !reference [.rn-sdk-workflow, rules]
    - !reference [.app-workflow, rules]
    - !reference [.release-workflow, rules]
  cache:
    - key:
        files:
          - Cargo.lock
        prefix: cargo-deps
      paths:
        - .cargo/registry/index
        - .cargo/registry/cache
        - .cargo/git/db
      policy: pull
    - key: rs-core-target-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      fallback_keys:
        - rs-core-target-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      paths:
        - target
  script:
    - cd packages/rs-core-uniffi-web
    - |
      rustup target add \
        wasm32-unknown-unknown
    - pnpm i
    - pnpm build --release
  artifacts:
    paths:
      - packages/rs-core-uniffi-web/dist
    expire_in: 1 week
