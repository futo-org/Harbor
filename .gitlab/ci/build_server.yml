.server-workflow:
  image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^server-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - services/server/**/*
        - .gitlab/ci/build_server.yml
        - .gitlab/ci/deploy_server.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/server/**/*
        - .gitlab/ci/build_server.yml
        - .gitlab/ci/deploy_server.yml
  variables:
    RUNNER_SCRIPT_TIMEOUT: 179m

.server-rust-base:
  extends: .server-workflow
  image: ${RUST_IMAGE}
  stage: check

server-format-check:
  extends: .server-rust-base
  script:
    - cargo fmt --check --package server
  allow_failure: true

server-clippy:
  extends: .server-rust-base
  script:
    - cargo clippy --package server -- -D warnings
  allow_failure: true

server-build:
  extends: .server-rust-base
  stage: build
  script:
    - cargo build --release --package server
  artifacts:
    paths:
      - target/release/server
    expire_in: 1 week

server-image:
  extends: .server-workflow
  image:
    name: moby/buildkit:rootless
    entrypoint: ['']
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  stage: build
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./services/server \
        --output type=image,name=$CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA,push=true
