.server-workflow:
  image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^server-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - services/server/*
        - .gitlab/ci/build_server.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/server/*
        - .gitlab/ci/build_server.yml
  variables:
    RUNNER_SCRIPT_TIMEOUT: 179m
    DOCKER_FULL_IMAGE_NAME: '${CI_REGISTRY}/${CI_PROJECT_PATH}'
    RUST_IMAGE: '${CI_REGISTRY}/${CI_PROJECT_PATH}:base'
  before_script:
    - cd services/server

.server-rust-base:
  extends: .server-workflow
  image: ${RUST_IMAGE}
  stage: check

server-format-check:
  extends: .server-rust-base
  script:
    - cargo fmt --check

server-clippy:
  extends: .server-rust-base
  script:
    - cargo clippy -- -D warnings

server-build:
  extends: .server-rust-base
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/server
    expire_in: 1 week
