.app-workflow:
  image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        # Charts pin this commit's image SHA (appVersion), so the image must
        # exist even for chart-only changes.
        - deploy/charts/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
        - .gitlab/ci/publish_charts.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - deploy/charts/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
        - .gitlab/ci/publish_charts.yml

# Lightweight base for checks (format, tests): node + pnpm install, no
# SDK build artifacts needed.
.app-check-base:
  extends: .app-workflow
  image: node:24-slim
  before_script:
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install

app-biome-check:
  extends: .app-check-base
  stage: check
  script:
    - pnpm exec biome check apps/harbor --diagnostic-level=error
  allow_failure: true

app-tests:
  extends: .app-check-base
  stage: check
  script:
    - pnpm --filter polycentric-app test:ci
    # - pnpm --filter polycentric-app typecheck
  artifacts:
    when: always
    reports:
      junit: apps/harbor/junit.xml

.app-build-base:
  extends: .app-workflow
  needs:
    - job: rn-sdk-build
      artifacts: true
    - job: js-sdks-build
      artifacts: true
    - job: rs-core-uniffi-web-build
      artifacts: true

app-web-image:
  extends: .app-build-base
  rules:
    - !reference [.app-workflow, rules]
    - !reference [.release-workflow, rules]
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  stage: build
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./apps/harbor \
        --opt build-arg:EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS=$EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS \
        --opt build-arg:EXPO_PUBLIC_POLYCENTRIC_VERIFIER_SERVERS=$EXPO_PUBLIC_POLYCENTRIC_VERIFIER_SERVERS \
        --opt build-arg:SKIP_WORKSPACE_BUILD=1 \
        --import-cache type=registry,ref=$CI_REGISTRY_IMAGE/app:cache-$CI_DEFAULT_BRANCH \
        --import-cache type=registry,ref=$CI_REGISTRY_IMAGE/app:cache-$CI_COMMIT_REF_SLUG \
        --export-cache type=registry,ref=$CI_REGISTRY_IMAGE/app:cache-$CI_COMMIT_REF_SLUG,mode=max \
        --output type=image,name=$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA,push=true

.app-build-expo:
  extends: .app-build-base
  stage: build
  image: node:24-slim
  before_script:
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install
    - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
    # Tag builds use the tag version; others use the latest release + a patch.
    - export APP_VERSION=$(node "$CI_PROJECT_DIR/tools/expo/resolve-version.js")
    - echo "Building app version ${APP_VERSION}"
    - cd ./apps/harbor

# EAS builds run: manual on merge requests, automatic on the default branch and
# on tags. Each job saves the EAS build metadata (eas-build.json) so the
# deploy jobs in deploy_app.yml can submit or publish the result. Only the
# APK jobs wait for completion (the update feed needs the file); the store
# builds are queued with --no-wait and submitted later by build id.
.app-eas-build:
  extends: .app-build-expo
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
    - if: $CI_COMMIT_TAG =~ /^(v\d+\.\d+\.\d+|app-)/

# APKs follow the same staging/production split as the service deploys:
# staging builds from MRs and the default branch, production from release
# tags or a manual run. These wait for EAS and download the APK so the
# deploy jobs can publish it to the update feed.
.app-android-apk:
  extends: .app-eas-build
  script:
    - npx eas-cli build --platform android --profile ${EAS_PROFILE} --non-interactive --wait --json > eas-build.json
    # eas only builds remotely; download the resulting APK so it is a CI artifact.
    - node "$CI_PROJECT_DIR/tools/expo/download-apk.js" eas-build.json harbor.apk
  artifacts:
    paths:
      - apps/harbor/harbor.apk
      - apps/harbor/eas-build.json
    expire_in: 1 week

app-android-apk-staging:
  extends: .app-android-apk
  variables:
    EAS_PROFILE: staging-apk
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.app-eas-build, rules]

app-android-apk-production:
  extends: .app-android-apk
  variables:
    EAS_PROFILE: production-apk
  rules:
    - if: $CI_COMMIT_TAG =~ /^(v\d+\.\d+\.\d+|app-)/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
      when: manual
      allow_failure: true

# Store builds only queue the build on EAS: staging from the default
# branch, production on release tags or a manual run. Submission to the
# internal/TestFlight track happens in the deploy jobs — see deploy_app.yml.
.app-store-staging-rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.app-eas-build, rules]

.app-store-production-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^(v\d+\.\d+\.\d+|app-)/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
      when: manual
      allow_failure: true

.app-store-build:
  extends: .app-eas-build
  script:
    - npx eas-cli build --platform ${EAS_PLATFORM} --profile ${EAS_PROFILE} --non-interactive --no-wait --json > eas-build.json
  artifacts:
    paths:
      - apps/harbor/eas-build.json
    expire_in: 1 week

app-android-aab-staging:
  extends: .app-store-build
  rules: !reference [.app-store-staging-rules, rules]
  variables:
    EAS_PLATFORM: android
    EAS_PROFILE: staging

app-android-aab-production:
  extends: .app-store-build
  rules: !reference [.app-store-production-rules, rules]
  variables:
    EAS_PLATFORM: android
    EAS_PROFILE: production

app-ios-staging:
  extends: .app-store-build
  rules: !reference [.app-store-staging-rules, rules]
  variables:
    EAS_PLATFORM: ios
    EAS_PROFILE: staging

app-ios-production:
  extends: .app-store-build
  rules: !reference [.app-store-production-rules, rules]
  variables:
    EAS_PLATFORM: ios
    EAS_PROFILE: production
