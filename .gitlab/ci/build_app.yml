.app-workflow:
  image: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^app-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml

# Lightweight base for checks (format, tests): node + pnpm install, no
# SDK build artifacts needed.
.app-check-base:
  extends: .app-workflow
  image: node:24-slim
  before_script:
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install

app-format-check:
  extends: .app-check-base
  stage: check
  script:
    - pnpm format apps/polycentric
  allow_failure: true

app-tests:
  extends: .app-check-base
  stage: check
  script:
    - pnpm --filter polycentric-app test

.app-build-base:
  extends: .app-workflow
  needs:
    - job: rn-sdk-build
      artifacts: true
    - job: js-sdks-build
      artifacts: true
    - job: rs-core-uniffi-web-build
      artifacts: true

app-web-image:
  extends: .app-build-base
  rules:
    - !reference [.app-workflow, rules]
    - !reference [.release-workflow, rules]
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  stage: build
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./apps/polycentric \
        --opt build-arg:EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS=$EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS \
        --opt build-arg:SKIP_WORKSPACE_BUILD=1 \
        --import-cache type=registry,ref=$CI_REGISTRY_IMAGE/app:cache-$CI_DEFAULT_BRANCH \
        --import-cache type=registry,ref=$CI_REGISTRY_IMAGE/app:cache-$CI_COMMIT_REF_SLUG \
        --export-cache type=registry,ref=$CI_REGISTRY_IMAGE/app:cache-$CI_COMMIT_REF_SLUG,mode=max \
        --output type=image,name=$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA,push=true

.app-build-expo:
  extends: .app-build-base
  stage: build
  image: node:24-slim
  before_script:
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install
    - apt-get update && apt-get install -y --no-install-recommends git
    # Tag builds use the tag version; others use the latest release + a patch.
    - export APP_VERSION=$(node "$CI_PROJECT_DIR/tools/expo/resolve-version.js")
    - echo "Building app version ${APP_VERSION}"
    - cd ./apps/polycentric

# EAS builds run: manual on merge requests, automatic on the default branch and
# on tags. Only the APK waits for completion (we download it); the others are
# fire-and-forget.
.app-eas-build:
  extends: .app-build-expo
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - apps/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
    - if: $CI_COMMIT_TAG =~ /^(v\d+\.\d+\.\d+|app-)/

app-android-apk:
  extends: .app-eas-build
  script:
    - npx eas-cli build --platform android --profile preview --non-interactive --wait --json > eas-build.json
    # eas only builds remotely; download the resulting APK so it is a CI artifact.
    - node "$CI_PROJECT_DIR/tools/expo/download-apk.js" eas-build.json polycentric.apk
  artifacts:
    paths:
      - apps/polycentric/polycentric.apk
      - apps/polycentric/eas-build.json
    expire_in: 1 week

app-android-aab:
  extends: .app-eas-build
  script:
    - npx eas-cli build --platform android --non-interactive --no-wait --auto-submit

app-ios:
  extends: .app-eas-build
  script:
    - npx eas-cli build --platform ios --non-interactive --no-wait --auto-submit
