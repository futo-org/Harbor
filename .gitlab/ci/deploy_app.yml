.app-deploy-workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/polycentric/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml

########################################
# Tag the image with environment label #
########################################

.app-deploy-image:
  extends: .app-deploy-workflow
  stage: deploy
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: ['']
  script:
    - crane auth login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - crane tag $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA $ENVIRONMENT
  needs:
    - job: app-web-image
      artifacts: false

app-deploy-image-staging:
  extends: .app-deploy-image
  variables:
    ENVIRONMENT: staging

app-deploy-image-production:
  extends: .app-deploy-image
  when: manual
  variables:
    ENVIRONMENT: production

###############################
# Rolling restart on Manifest #
###############################

.app-deploy-manifest:
  extends: .app-deploy-workflow
  stage: deploy
  trigger:
    project: devops/manifest
    branch: master
    strategy: depend
  variables:
    MANIFEST_SETUP_COMMAND: quick
    MANIFEST_QUICK_TARGETS: inventory/polycentric-2026/app.yml:$ENVIRONMENT
    MANIFEST_STAGGER_TIME: '10'

app-deploy-manifest-staging:
  extends: .app-deploy-manifest
  variables:
    ENVIRONMENT: staging
  needs:
    - app-deploy-image-staging

app-deploy-manifest-production:
  extends: .app-deploy-manifest
  variables:
    ENVIRONMENT: production
  needs:
    - app-deploy-image-production

###############################
# Cloudflare Pages deploy     #
###############################

.app-web-cf-pages:
  extends: .app-build-expo
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/polycentric/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml
  variables:
    EXPO_WEB_OUTPUT: single
    CF_PAGES_PROJECT: fusmi26
  script:
    - npx expo export --platform web
    - npm install -g wrangler
    - |
      if ! wrangler pages project list | grep -q "$CF_PAGES_PROJECT"; then
        wrangler pages project create $CF_PAGES_PROJECT --production-branch production
      fi
    - wrangler pages deploy ./dist --project-name=$CF_PAGES_PROJECT --branch=$ENVIRONMENT

app-web-cf-pages-staging:
  extends: .app-web-cf-pages
  variables:
    ENVIRONMENT: staging
    EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS: https://staging-server.polycentric.dev

app-web-cf-pages-production:
  extends: .app-web-cf-pages
  when: manual
  variables:
    ENVIRONMENT: production
    EXPO_PUBLIC_POLYCENTRIC_SEED_SERVERS: https://server.polycentric.dev
