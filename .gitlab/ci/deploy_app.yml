.app-deploy-workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/harbor/**/*
        - .gitlab/ci/build_app.yml
        - .gitlab/ci/deploy_app.yml

########################################
# Tag the image with environment label #
########################################

.app-deploy-image:
  extends: .app-deploy-workflow
  stage: deploy
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - ENVIRONMENT_TAG="${CI_ENVIRONMENT_NAME%%/*}"
    - crane tag $CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA $ENVIRONMENT_TAG
  needs:
    - job: app-web-image
      artifacts: false

app-deploy-image-staging:
  extends: .app-deploy-image
  environment:
    name: staging/app

app-deploy-image-production:
  extends: .app-deploy-image
  when: manual
  environment:
    name: production/app

###############################
# Rolling restart on Manifest #
###############################

.app-deploy-manifest:
  extends: .app-deploy-workflow
  stage: deploy
  trigger:
    project: devops/manifest
    branch: master
    strategy: depend
  variables:
    MANIFEST_SETUP_COMMAND: quick
    MANIFEST_STAGGER_TIME: "10"

app-deploy-manifest-staging:
  extends: .app-deploy-manifest
  variables:
    MANIFEST_QUICK_TARGETS: inventory/polycentric-2026/app.yml:staging
  needs:
    - app-deploy-image-staging

app-deploy-manifest-production:
  extends: .app-deploy-manifest
  variables:
    MANIFEST_QUICK_TARGETS: inventory/polycentric-east/app.yml:polycentriceast,inventory/polycentric-west/app.yml:polycentricwest
  needs:
    - app-deploy-image-production
