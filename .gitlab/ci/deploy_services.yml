.service-deploy-image:
  stage: deploy
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - ENVIRONMENT_TAG="${CI_ENVIRONMENT_NAME%%/*}"
    - crane tag $CI_REGISTRY_IMAGE/${SERVICE_NAME}:$CI_COMMIT_SHA $ENVIRONMENT_TAG

.service-deploy-manifest:
  stage: deploy
  trigger:
    project: devops/manifest
    branch: master
    strategy: depend
  variables:
    MANIFEST_SETUP_COMMAND: quick
    MANIFEST_STAGGER_TIME: "10"

########################################################################
# server
########################################################################

.server-deploy-workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/server/**/*
        - services/common/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
  variables:
    SERVICE_NAME: server

########################################
# Tag the image with environment label #
########################################

.server-deploy-image:
  extends:
    - .server-deploy-workflow
    - .service-deploy-image
  needs:
    - job: server-image
      artifacts: false

server-deploy-image-staging:
  extends: .server-deploy-image
  environment:
    name: staging/server

server-deploy-image-production:
  extends: .server-deploy-image
  when: manual
  environment:
    name: production/server

###############################
# Rolling restart on Manifest #
###############################

server-deploy-manifest-staging:
  extends:
    - .server-deploy-workflow
    - .service-deploy-manifest
  variables:
    MANIFEST_QUICK_TARGETS: inventory/polycentric-2026/server.yml:staging
  needs:
    - server-deploy-image-staging

server-deploy-manifest-production:
  extends:
    - .server-deploy-workflow
    - .service-deploy-manifest
  variables:
    MANIFEST_QUICK_TARGETS: inventory/polycentric-east/server.yml:polycentriceast,inventory/polycentric-west/server.yml:polycentricwest
  needs:
    - server-deploy-image-production

########################################################################
# moderation
########################################################################

.moderation-deploy-workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/moderation/**/*
        - services/common/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
  variables:
    SERVICE_NAME: moderation-service

########################################
# Tag the image with environment label #
########################################

moderation-deploy-image-production:
  extends:
    - .moderation-deploy-workflow
    - .service-deploy-image
  when: manual
  environment:
    name: production/moderation-service
  needs:
    - job: moderation-image
      artifacts: false

###############################
# Rolling restart on Manifest #
###############################

moderation-deploy-manifest-production:
  extends:
    - .moderation-deploy-workflow
    - .service-deploy-manifest
  variables:
    MANIFEST_QUICK_TARGETS: inventory/polycentric-east/moderation.yml:polycentriceast
  needs:
    - moderation-deploy-image-production

########################################################################
# notifications
########################################################################

.push-notifications-deploy-workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/push-notifications/**/*
        - services/common/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
  variables:
    SERVICE_NAME: push-notifications-service

########################################
# Tag the image with environment label #
########################################

push-notifications-deploy-image-production:
  extends:
    - .push-notifications-deploy-workflow
    - .service-deploy-image
  when: manual
  environment:
    name: production/push-notifications-service
  needs:
    - job: push-notifications-image
