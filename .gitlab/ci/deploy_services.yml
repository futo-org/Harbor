########################################################################
# scraper
#
# Runtime needs (NET_ADMIN, zombie reaping, internal-only networking) are
# set in deploy/charts/harbor-scraper — compose.yml only covers local dev.
########################################################################

.scraper-deploy-workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - tools/**/*
        - patches/**/*
        - services/scraper/**/*
        - deploy/charts/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
