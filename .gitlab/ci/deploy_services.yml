.service-deploy-image:
  stage: deploy
  # Never auto-cancel a deploy mid-run on a new commit.
  interruptible: false
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - ENVIRONMENT_TAG="${CI_ENVIRONMENT_NAME%%/*}"
    - crane tag $CI_REGISTRY_IMAGE/${SERVICE_NAME}:$CI_COMMIT_SHA $ENVIRONMENT_TAG
    - crane tag $CI_REGISTRY_IMAGE/charts/${CHART_NAME}:$CHART_VERSION $ENVIRONMENT_TAG

########################################################################
# server
########################################################################

.server-deploy-workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - services/server/**/*
        - services/common/**/*
        - deploy/charts/**/*
        - .gitlab/ci/build_services.yml
        - .gitlab/ci/deploy_services.yml
        - .gitlab/ci/publish_charts.yml
  variables:
    SERVICE_NAME: server
    CHART_NAME: harbor-server

##################################################
# Tag the image and chart with environment label #
##################################################

.server-deploy-image:
  extends:
    - .server-deploy-workflow
    - .service-deploy-image
  needs:
    - job: server-image
      artifacts: false
    - job: charts-build
      artifacts: true

server-deploy-image-staging:
  extends: .server-deploy-image
  environment:
    name: staging/server

server-deploy-image-production:
  extends: .server-deploy-image
  when: manual
  environment:
    name: production/server

