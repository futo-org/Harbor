variables:
  IMAGES_PATH: '${CI_REGISTRY}/${CI_PROJECT_PATH}/ci'
  # Jobs pull the default-branch image; pipelines that change an image push
  # their own branch tag, which becomes this tag once merged.
  RUST_IMAGE: '${IMAGES_PATH}/rust:${CI_DEFAULT_BRANCH}'
  RUST_DIND_IMAGE: '${IMAGES_PATH}/rust-dind:${CI_DEFAULT_BRANCH}'
  RUST_ANDROID_IMAGE: '${IMAGES_PATH}/rust-android:${CI_DEFAULT_BRANCH}'

.setup-images-workflow:
  stage: setup
  image:
    name: moby/buildkit:rootless
    entrypoint: ['']
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/images/**/*
        - .gitlab/ci/setup_images.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab/images/**/*
        - .gitlab/ci/setup_images.yml

setup-image-rust:
  extends: .setup-images-workflow
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=.gitlab/images/rust \
        --local dockerfile=.gitlab/images/rust \
        --import-cache type=registry,ref=$IMAGES_PATH/rust:$CI_DEFAULT_BRANCH \
        --import-cache type=registry,ref=$IMAGES_PATH/rust:$CI_COMMIT_REF_SLUG \
        --export-cache type=inline \
        --output type=image,name=$IMAGES_PATH/rust:$CI_COMMIT_REF_SLUG,push=true

setup-image-rust-dind:
  extends: .setup-images-workflow
  needs: ['setup-image-rust']
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --opt build-arg:RUST_IMAGE=$IMAGES_PATH/rust:$CI_COMMIT_REF_SLUG \
        --local context=.gitlab/images/rust-dind \
        --local dockerfile=.gitlab/images/rust-dind \
        --import-cache type=registry,ref=$IMAGES_PATH/rust-dind:$CI_DEFAULT_BRANCH \
        --import-cache type=registry,ref=$IMAGES_PATH/rust-dind:$CI_COMMIT_REF_SLUG \
        --export-cache type=inline \
        --output type=image,name=$IMAGES_PATH/rust-dind:$CI_COMMIT_REF_SLUG,push=true

setup-image-rust-android:
  extends: .setup-images-workflow
  needs: ['setup-image-rust']
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --opt build-arg:RUST_IMAGE=$IMAGES_PATH/rust:$CI_COMMIT_REF_SLUG \
        --local context=.gitlab/images/rust-android \
        --local dockerfile=.gitlab/images/rust-android \
        --import-cache type=registry,ref=$IMAGES_PATH/rust-android:$CI_DEFAULT_BRANCH \
        --import-cache type=registry,ref=$IMAGES_PATH/rust-android:$CI_COMMIT_REF_SLUG \
        --export-cache type=inline \
        --output type=image,name=$IMAGES_PATH/rust-android:$CI_COMMIT_REF_SLUG,push=true
