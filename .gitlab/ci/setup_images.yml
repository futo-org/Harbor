variables:
  IMAGES_PATH: '${CI_REGISTRY}/${CI_PROJECT_PATH}/ci'
  # CI_IMAGES_TAG (set by the workflow rules in .gitlab-ci.yml) is the
  # commit SHA on branch/MR pipelines and the default branch on tag
  # pipelines. The ref-slug tag is pushed alongside the SHA tag only as
  # the build cache source for the branch's next commit.
  RUST_IMAGE: '${IMAGES_PATH}/rust:${CI_IMAGES_TAG}'
  RUST_DIND_IMAGE: '${IMAGES_PATH}/rust-dind:${CI_IMAGES_TAG}'
  RUST_ANDROID_IMAGE: '${IMAGES_PATH}/rust-android:${CI_IMAGES_TAG}'

# Ensures the per-commit CI images exist in the registry and in the runner
# host's docker cache: pulls them when this commit's tags already exist,
# builds and pushes them otherwise. Consuming jobs use pull_policy
# if-not-present, so this is the only job that hits the registry for them.
setup-images:
  stage: setup
  image:
    name: gitlab.futo.org:5050/devops/manifest-repo/library/docker:latest
    pull_policy: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      build_or_pull() {
        name=$1; shift
        if docker pull "$IMAGES_PATH/$name:$CI_COMMIT_SHA"; then
          return
        fi
        docker build "$@" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$IMAGES_PATH/$name:$CI_DEFAULT_BRANCH" \
          --cache-from "$IMAGES_PATH/$name:$CI_COMMIT_REF_SLUG" \
          --tag "$IMAGES_PATH/$name:$CI_COMMIT_SHA" \
          --tag "$IMAGES_PATH/$name:$CI_COMMIT_REF_SLUG" \
          ".gitlab/images/$name"
        docker push "$IMAGES_PATH/$name:$CI_COMMIT_SHA"
        docker push "$IMAGES_PATH/$name:$CI_COMMIT_REF_SLUG"
      }
      build_or_pull rust
      build_or_pull rust-dind --build-arg RUST_IMAGE=$RUST_IMAGE
      build_or_pull rust-android --build-arg RUST_IMAGE=$RUST_IMAGE

# Deletes the branch image tags.
setup-images-cleanup:
  stage: setup
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ "$CI_COMMIT_REF_SLUG" = "$CI_DEFAULT_BRANCH" ]; then
        echo "Refusing to delete the default branch tags"
        exit 0
      fi
      curl -fsS --header "PRIVATE-TOKEN: $CI_API_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories?per_page=100" \
      | jq -r --arg prefix "$CI_PROJECT_PATH/ci/" \
          '.[] | select(.path | startswith($prefix)) | .id' \
      | while read -r repo_id; do
          echo "Deleting tag $CI_COMMIT_REF_SLUG from repository $repo_id"
          curl -fsS -o /dev/null -X DELETE --header "PRIVATE-TOKEN: $CI_API_TOKEN" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$repo_id/tags/$CI_COMMIT_REF_SLUG" \
            || echo "    (tag absent or delete failed)"
        done
