.rn-sdk-workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^rn-sdk-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - packages/react-native/**/*
        - .gitlab/ci/build_rn_sdk.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - packages/react-native/**/*
        - .gitlab/ci/build_rn_sdk.yml

rn-android-build:
  extends: .rn-sdk-workflow
  image: $RUST_IMAGE
  stage: build
  rules:
    - !reference [.rn-sdk-workflow, rules]
    - !reference [.rs-core-workflow, rules]
    - !reference [.app-workflow, rules]
    - !reference [.release-workflow, rules]
  cache:
    - key: rs-core-cargo-deps-${CI_COMMIT_REF_SLUG}
      fallback_keys:
        - rs-core-cargo-deps-${CI_DEFAULT_BRANCH}
      paths:
        - .cargo/registry/index
        - .cargo/registry/cache
        - .cargo/git/db
    - key: rs-core-target-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      fallback_keys:
        - rs-core-target-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      paths:
        - target
  script:
    - cd packages/react-native
    - |
      rustup target add \
        aarch64-linux-android \
        armv7-linux-androideabi \
        i686-linux-android \
        x86_64-linux-android
    - pnpm i
    - pnpm ubrn:android --release
  artifacts:
    paths:
      - packages/react-native/android/src/main/jniLibs
    expire_in: 1 week

.rn-sdk-ios-build:
  extends: .rn-sdk-workflow
  stage: build
  rules:
    - !reference [.rn-sdk-workflow, rules]
    - !reference [.rs-core-workflow, rules]
    - !reference [.app-workflow, rules]
    - !reference [.release-workflow, rules]
  tags:
    - macscript
  variables:
    GIT_STRATEGY: clone
  before_script:
    - env | grep '^CI_' > .cienv
  artifacts:
    expire_in: 1 week

rn-ios-build:
  extends: .rn-sdk-ios-build
  script:
    - |
      cirrus run buildReactNativeIOS \
        --artifacts-dir . \
        --env-file .cienv
    - mkdir -p packages/react-native/ios
    - cp -R buildReactNativeIOS/binary/packages/react-native/ios/. packages/react-native/ios/
    - cp -R buildReactNativeIOS/xcframework/packages/react-native/PolycentricReactNativeFramework.xcframework packages/react-native/
  artifacts:
    paths:
      - packages/react-native/ios
      - packages/react-native/PolycentricReactNativeFramework.xcframework
    expire_in: 1 week

rn-ios-tart-prune:
  extends: .rn-sdk-ios-build
  needs:
    - job: rn-ios-build
      artifacts: false
  before_script: []
  script:
    - tart prune --entries vms --older-than 2

.rn-sdk-base:
  extends: .rn-sdk-workflow
  image: node:24-slim
  before_script:
    - npm install -g pnpm@10
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install
  needs:
    - job: js-sdks-build
      artifacts: true
    - job: rn-android-build
      artifacts: true
    - job: rn-ios-build
      artifacts: true
    - job: rs-core-uniffi-web-build
      artifacts: true

rn-sdk-build:
  extends: .rn-sdk-base
  stage: build
  script:
    - cd packages/react-native
    - pnpm build
  artifacts:
    paths:
      - packages/react-native
    expire_in: 1 week
  rules:
    - !reference [.rn-sdk-workflow, rules]
    - !reference [.rs-core-workflow, rules]
    - !reference [.app-workflow, rules]
    - !reference [.release-workflow, rules]
