.js-sdk-workflow:
  image: node:24-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^js-sdk-/
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
        - packages/js-*/**/*
        - .gitlab/ci/build_js_sdks.yml
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pnpm-lock.yaml
        - packages/js-*/**/*
        - .gitlab/ci/build_js_sdks.yml

.js-sdks-base:
  extends: .js-sdk-workflow
  variables:
    PNPM_STORE_DIR: ${CI_PROJECT_DIR}/.pnpm-store
  cache:
    key: js-sdks-pnpm-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - js-sdks-pnpm-${CI_DEFAULT_BRANCH}
    paths:
      - .pnpm-store
  before_script:
    - npm install -g pnpm@10
    - pnpm config set store-dir ${PNPM_STORE_DIR}
    - pnpm config set @polycentric:registry https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    - pnpm install

js-sdks-format-check:
  extends: .js-sdks-base
  stage: check
  script:
    - pnpm format
  allow_failure: true

js-sdks-lint-check:
  extends: .js-sdks-base
  stage: check
  script:
    - pnpm --filter js-core lint
  allow_failure: true

js-core-tests-check:
  extends: .js-sdks-base
  stage: check
  allow_failure: true
  script:
    - pnpm --filter js-core test:run

js-sdks-build:
  extends: .js-sdks-base
  stage: build
  script:
    - pnpm --filter='./packages/js-*' run build
  artifacts:
    paths:
      - packages/js-*/dist
    expire_in: 1 week
  needs:
    - job: rs-core-uniffi-web-build
      artifacts: true
  rules:
    - !reference [.js-sdk-workflow, rules]
    - !reference [.rs-core-workflow, rules]
    - !reference [.rn-sdk-workflow, rules]
    - !reference [.app-workflow, rules]
    - !reference [.release-workflow, rules]

.js-sdks-publish-npm:
  rules:
    - if: $CI_COMMIT_TAG =~ /^js-sdk-/
  image: node:latest
  stage: publish
  needs:
    - job: js-sdks-build
      artifacts: true
  script:
    - |
      VERSION=${CI_COMMIT_TAG#js-sdk-}
      cd $PKG_DIR
      sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" package.json
      echo "@polycentric:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
      echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
      npm publish

js-sdks-publish-js-core:
  extends: .js-sdks-publish-npm
  variables:
    PKG_DIR: packages/js-core

js-sdks-publish-js-browser:
  extends: .js-sdks-publish-npm
  variables:
    PKG_DIR: packages/js-browser

js-sdks-publish-js-node:
  extends: .js-sdks-publish-npm
  variables:
    PKG_DIR: packages/js-node
