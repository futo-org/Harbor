url: ${MAESTRO_WEB_URL}
name: I can quote a post
---
- runFlow: ../elements/load.yaml
- runFlow: ../steps/fresh-start.yaml
- runFlow: ../steps/create-identity.yaml
- runFlow: ../steps/sort-explore-latest.yaml
- runFlow: ../steps/scroll-down.yaml
- runFlow: ../steps/open-post-menu.yaml
- tapOn:
    role: menuitem
    text: ${output.post.quote}
# The composer previews the quoted post under "Quoting <author>", once the
# author's profile has loaded (it shows "Quoting …" until then).
- assertVisible: ${output.composer.quoting}
- extendedWaitUntil:
    notVisible: ${output.composer.quoting} …
    timeout: 30000
- evalBrowserScript:
    script: |
      // The sheet overlays the feed, where a post's text may also start with
      // "Quoting ", so search the nearest ancestor of the composer's submit
      // button that holds the heading.
      const submit = document.querySelector('[data-testid="composeSubmit"]');
      let heading;
      for (let scope = submit; scope && !heading; scope = scope.parentElement) {
        heading = [...scope.querySelectorAll('div')].find(
          (el) => el.childElementCount === 0 && el.textContent.startsWith('Quoting '),
        );
      }
      return heading.textContent.slice('Quoting '.length).replace(/…$/, '');
    output: quotedAuthor
- tapOn: ${output.composer.input}
# Unique per run, so it can't be confused with an earlier run's quote (which
# may well be the post being quoted).
- evalScript: ${output.quoteText = 'Sharing this one ' + Date.now().toString(36)}
- inputText: ${output.quoteText}
- tapOn:
    id: ${output.composer.submit}
- extendedWaitUntil:
    notVisible:
      id: ${output.composer.submit}
    timeout: 30000
# The quote heads the profile; its thread shows the quoted post with it.
- tapOn:
    id: ${output.nav.profile}
- extendedWaitUntil:
    visible: ${output.quoteText}
    timeout: 30000
- tapOn: ${output.quoteText}
- extendedWaitUntil:
    visible: ${output.post.replyPrompt}
    timeout: 30000
# The quoted post loads separately from the thread.
- extendedWaitUntil:
    visible: ${quotedAuthor}
    timeout: 30000
