appId: ${MAESTRO_APP_ID}
---
# Scrolls the feed down to the first post that ends below the screen, once
# the feed has loaded, and marks it for open-post-menu.yaml. Scrolling to a
# post rather than by a screen keeps its repost menu on screen however tall
# the posts are. The web driver's swipes don't move the page, so scroll from
# a script.
- evalBrowserScript:
    script: |
      const sleep = () => new Promise((resolve) => setTimeout(resolve, 100));
      const findPostEndingBelowScreen = () =>
        [...document.querySelectorAll('[role="article"]')].find(
          (el) => el.getBoundingClientRect().bottom > window.innerHeight,
        );
      for (let i = 0; i < 300 && !findPostEndingBelowScreen(); i++) await sleep();
      const post = findPostEndingBelowScreen();
      if (!post) throw new Error('no post below the screen');
      post.id = 'menuPost';
      // The menu is in the post's last row: bring it to the middle, clear of
      // the sticky header.
      window.scrollBy(0, post.getBoundingClientRect().bottom - window.innerHeight / 2);
      return true;
# A slow browser keeps laying out the feed after the scroll.
- waitForAnimationToEnd
# assertVisible passes for elements outside the screen, so check the menu's
# position here. Scripts can't read flow variables, hence the labels.
- evalBrowserScript:
    script: |
      return [...document.querySelectorAll('#menuPost [aria-label]')]
        .filter((el) => {
          const rect = el.getBoundingClientRect();
          return rect.top >= 0 && rect.bottom <= window.innerHeight;
        })
        .map((el) => el.getAttribute('aria-label'))
        .join('\n');
    output: labelsOnScreen
- assertTrue: ${labelsOnScreen.split('\n').includes(output.post.menu)}
