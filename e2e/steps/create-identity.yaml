appId: ${MAESTRO_APP_ID}
---
- tapOn: ${output.onboarding.createIdentity}
- tapOn: ${output.onboarding.displayName}
# Unique per run, so flows can tell this identity's content from earlier
# runs' on a shared server.
- evalScript: ${output.identityName = 'Maestro ' + Date.now().toString(36)}
- inputText: ${output.identityName}
- tapOn: ${output.onboarding.continue}
# Creating the identity publishes to the server, so give it room. The app
# lands on Explore over a hidden Home, whose sidebar comes first in the page,
# so match every Profile link rather than the first one by label.
- extendedWaitUntil:
    visible:
      css: '[aria-label="${output.nav.profile}"]'
    timeout: 120000
