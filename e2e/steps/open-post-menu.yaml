appId: ${MAESTRO_APP_ID}
---
# Opens the repost menu of the post in the middle of the screen. The web
# driver has no relative selectors, so a script first marks that post. The
# feed is virtualised, so only a post already on screen is safe to target.
- evalBrowserScript:
    script: |
      // Later runs reuse the mark, so they reopen the same post after the feed shifts.
      if (document.getElementById('menuPost')) return window.scrollY;
      const middle = window.innerHeight / 2;
      const distance = (rect) => Math.abs(rect.top + rect.height / 2 - middle);
      // output.post.menu; browser scripts don't interpolate variables.
      const buttons = [
        ...document.querySelectorAll('[role="article"] [aria-label="Repost or quote"]'),
      ]
        .map((el) => ({ el, rect: el.getBoundingClientRect() }))
        // Skip buttons off screen or under the sticky header, which the tap would scroll to.
        .filter(({ el, rect }) =>
          el.contains(document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2)),
        );
      buttons
        .sort((a, b) => distance(a.rect) - distance(b.rect))[0]
        .el.closest('[role="article"]').id = 'menuPost';
      return window.scrollY;
    output: scrollBefore
# The page must be scrolled for the last check to mean anything.
- assertTrue: ${scrollBefore > 0}
- tapOn:
    css: '#menuPost [aria-label="${output.post.menu}"]'
- assertVisible:
    role: menuitem
    text: ${output.post.quote}
# Opening the menu leaves the page where it was.
- evalBrowserScript:
    script: return window.scrollY
    output: scrollAfter
- assertTrue: ${scrollAfter == scrollBefore}
