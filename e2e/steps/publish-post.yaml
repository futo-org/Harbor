# Publishes a post that says ${TEXT}.
- tapOn:
    id: ${output.nav.compose}
- tapOn: ${output.composer.input}
- inputText: ${TEXT}
- tapOn:
    id: ${output.composer.submit}
# The composer closes once the post is published.
- extendedWaitUntil:
    notVisible:
      id: ${output.composer.submit}
    timeout: 30000
