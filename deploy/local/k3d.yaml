apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: harbor
servers: 1
agents: 0
# Same Kubernetes minor as the production cluster.
image: rancher/k3s:v1.34.12-k3s1
registries:
  create:
    name: k3d-registry.localhost
    host: "0.0.0.0"
    hostPort: "5000"
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters: [ "server:*" ]
      - arg: "--disable=servicelb"
        nodeFilters: [ "server:*" ]
      - arg: "--disable=metrics-server"
        nodeFilters: [ "server:*" ]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
