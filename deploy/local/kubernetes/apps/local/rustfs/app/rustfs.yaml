---
# Stands in for the S3 bucket, like compose's rustfs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          env:
            # rustfs refuses the default credentials on non-loopback listeners otherwise.
            - name: RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS
              value: "true"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: s3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
    - name: console
      port: 9001
---
# Creates the blob bucket, like compose's rustfs-init.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rc
          image: rustfs/rc:latest@sha256:7e93fd410a8fe51514f89373e093392c92095b98dc6140335fcfe956810c4c80
          command:
            - /bin/sh
            - -c
            - |
              until rc alias set rustfs http://rustfs:9000 rustfsadmin rustfsadmin >/dev/null 2>&1; do
                echo 'waiting for rustfs...'; sleep 1;
              done
              rc mb -p rustfs/polycentric-blobs
