---
# DB URLs on the shared harbor-pg cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-push-notifications-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: harbor-pg
  target:
    name: harbor-push-notifications-db
    template:
      data:
        HARBOR_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-pooler-rw.harbor-pg.svc:5432/notifications"
        HARBOR_DATABASE_URL_RO: "postgresql://{{ .username }}:{{ .password }}@postgres-pooler-rw.harbor-pg.svc:5432/notifications"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-app
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-app
        property: password
