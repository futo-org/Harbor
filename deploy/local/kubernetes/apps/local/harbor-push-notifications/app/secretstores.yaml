---
# Reads the CNPG connection secret out of the harbor-pg namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: harbor-pg
spec:
  provider:
    kubernetes:
      remoteNamespace: harbor-pg
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-push-notifications-secret-reader-review
rules:
  - apiGroups: [ "authorization.k8s.io" ]
    resources: [ "selfsubjectrulesreviews" ]
    verbs: [ "create" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-push-notifications-secret-reader-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-push-notifications-secret-reader-review
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: harbor-push-notifications
