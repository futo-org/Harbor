---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  targetNamespace: external-secrets
  path: ./deploy/local/kubernetes/apps/local/external-secrets/app
  prune: true
  wait: true
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: harbor
