---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-scraper
  namespace: flux-system
spec:
  targetNamespace: harbor-scraper
  path: ./deploy/local/kubernetes/apps/local/harbor-scraper/app
  prune: true
  wait: true
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: harbor
