---
# Only harbor-server may reach it (it fetches user URLs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scraper-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor-server
      ports:
        - port: 8855
