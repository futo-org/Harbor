---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-moderation
  namespace: flux-system
spec:
  targetNamespace: harbor-moderation
  path: ./deploy/local/kubernetes/apps/local/harbor-moderation/app
  prune: true
  wait: true
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: harbor
  dependsOn:
    - name: external-secrets
    - name: harbor-pg
    - name: kafka
    - name: rustfs
    - name: harbor-server
