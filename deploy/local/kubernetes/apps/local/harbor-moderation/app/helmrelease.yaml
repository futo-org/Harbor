---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor-moderation
spec:
  interval: 1h
  chart:
    spec:
      chart: deploy/charts/harbor-moderation
      sourceRef:
        kind: GitRepository
        name: harbor
  values:
    replicaCount: 1
    env:
      - name: HARBOR_DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: harbor-moderation-db
            key: HARBOR_DATABASE_URL
      - name: HARBOR_DATABASE_URL_RO
        valueFrom:
          secretKeyRef:
            name: harbor-moderation-db
            key: HARBOR_DATABASE_URL_RO
      - name: HARBOR_MODERATION_SERVERS
        value: http://harbor-server.harbor-server.svc
      - name: HARBOR_CONTENT_BLOB_OS_BUCKET
        value: polycentric-blobs
      - name: HARBOR_CONTENT_BLOB_OS_ENDPOINT
        value: http://rustfs.rustfs.svc:9000
      - name: HARBOR_CONTENT_BLOB_OS_FORCE_PATH_STYLE
        value: "true"
      - name: HARBOR_CONTENT_BLOB_OS_ACCESS_KEY
        value: rustfsadmin
      - name: HARBOR_CONTENT_BLOB_OS_SECRET_KEY
        value: rustfsadmin
      - name: HARBOR_KAFKA_BROKERS
        value: kafka-kafka-bootstrap.kafka.svc:9092
      - name: HARBOR_KAFKA_CLUSTER_ID
        value: harbor-server
      - name: RUST_LOG
        value: info
    # Moderation identity, and Azure/PhotoDNA keys if set.
    envFrom:
      - secretRef:
          name: harbor-dev-env
          optional: true
