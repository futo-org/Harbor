---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-verifier-bot
  namespace: flux-system
spec:
  targetNamespace: harbor-verifier-bot
  path: ./deploy/local/kubernetes/apps/local/harbor-verifier-bot/app
  prune: true
  wait: true
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: harbor
  dependsOn:
    - name: external-secrets
    - name: harbor-pg
    - name: harbor-server
