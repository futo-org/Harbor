---
# DB URL on the shared harbor-pg cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-verifier-bot-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: harbor-pg
  target:
    name: harbor-verifier-bot-db
    template:
      data:
        HARBOR_VERIFIER_BOT_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-pooler-rw.harbor-pg.svc:5432/verifier_bot"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-app
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-app
        property: password
