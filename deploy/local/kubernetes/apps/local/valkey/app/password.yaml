---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: valkey
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-users
spec:
  refreshPolicy: CreatedOnce
  target:
    name: valkey-users
    template:
      data:
        default: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: valkey
