---
# Lets the server's external-secrets ServiceAccount mirror valkey-users.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: valkey-users-reader
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "get", "list", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: valkey-users-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: valkey-users-reader
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: harbor-server
