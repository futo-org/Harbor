---
# Lets the services' external-secrets ServiceAccounts read the postgres-app
# connection secret to template their own DATABASE_URLs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-secrets-reader
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "get", "list", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-secrets-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-secrets-reader
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: harbor-server
  - kind: ServiceAccount
    name: secret-reader
    namespace: harbor-moderation
  - kind: ServiceAccount
    name: secret-reader
    namespace: harbor-push-notifications
  - kind: ServiceAccount
    name: secret-reader
    namespace: harbor-verifier-bot
