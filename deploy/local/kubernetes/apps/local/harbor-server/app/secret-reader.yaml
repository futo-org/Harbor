---
# SecretStore identity; grants are in harbor-pg and valkey.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader
---
# For external-secrets' store validation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-server-secret-reader-review
rules:
  - apiGroups: [ "authorization.k8s.io" ]
    resources: [ "selfsubjectrulesreviews" ]
    verbs: [ "create" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-server-secret-reader-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-server-secret-reader-review
subjects:
  - kind: ServiceAccount
    name: secret-reader
    namespace: harbor-server
