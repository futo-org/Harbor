---
# Connection URLs for this service's database on the shared harbor-pg cluster.
# No replica locally, so the read-only URL goes to the same pooler.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-server-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: harbor-pg
  target:
    name: harbor-server-db
    template:
      data:
        HARBOR_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-pooler-rw.harbor-pg.svc:5432/harbor"
        HARBOR_DATABASE_URL_RO: "postgresql://{{ .username }}:{{ .password }}@postgres-pooler-rw.harbor-pg.svc:5432/harbor"
  data:
    - secretKey: username
      remoteRef:
        key: postgres-app
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-app
        property: password
---
# Valkey URL for live sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-server-valkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: valkey
  target:
    name: harbor-server-valkey
    template:
      data:
        HARBOR_VALKEY_URL: "redis://default:{{ .password }}@valkey.valkey.svc:6379"
  data:
    - secretKey: password
      remoteRef:
        key: valkey-users
        property: default
