---
# postgres-app from harbor-pg.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: harbor-pg
spec:
  provider:
    kubernetes:
      remoteNamespace: harbor-pg
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-reader
---
# valkey-users from valkey.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: valkey
spec:
  provider:
    kubernetes:
      remoteNamespace: valkey
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-reader
