---
# Reads the CNPG connection secret out of the harbor-pg namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: harbor-pg
spec:
  provider:
    kubernetes:
      remoteNamespace: harbor-pg
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-reader
---
# Reads valkey-users out of the valkey namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: valkey
spec:
  provider:
    kubernetes:
      remoteNamespace: valkey
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-reader
