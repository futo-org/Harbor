---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 30m
  path: ./deploy/local/kubernetes/apps/local
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: harbor
  dependsOn:
    - name: cluster-repos
  patches:
    # Substitute cluster-settings into every app Kustomization, as harbor-ops does.
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
