replicaCount: 2

image:
  # Built by the app-web-image CI job from apps/harbor/Dockerfile.
  repository: gitlab.futo.org:5050/harbor/harbor/app
  # CI tags every image with the commit SHA; deploy jobs re-tag the active
  # one per environment (staging / production). Environment tags are
  # mutable, hence pullPolicy Always.
  tag: staging
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

# Extra environment variables for the server container. EXPO_PUBLIC_* values
# are baked into the bundle at image build time and cannot be set here.
env: []

# The port server.js listens on (PORT env in the Dockerfile).
containerPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: harbor.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

# The server has no dedicated health endpoint; probing / serves the SPA
# index from disk.
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}

tolerations: []

affinity: {}
