apiVersion: v1
kind: Service
metadata:
  name: {{ include "harbor-push-notifications.fullname" . }}
  labels:
    {{- include "harbor-push-notifications.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      appProtocol: kubernetes.io/h2c
  selector:
    {{- include "harbor-push-notifications.selectorLabels" . | nindent 4 }}
