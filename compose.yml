services:
  postgres:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_PASSWORD: testing
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    # CI points this at the image built earlier in the pipeline.
    image: ${HARBOR_SERVER_IMAGE:-harbor-server}
    build:
      context: .
      dockerfile: services/server/Dockerfile
    ports:
      - ${HARBOR_SERVER_PORT:-3000}:3000
    environment: &server-env
      - RUST_LOG=${RUST_LOG:-debug}
      - HARBOR_DATABASE_URL=${HARBOR_DATABASE_URL:-postgres://postgres:testing@postgres:5432}
      - HARBOR_DATABASE_URL_RO=${HARBOR_DATABASE_URL_RO:-postgres://postgres:testing@postgres:5432?options=-c%20default_transaction_read_only=on}
      - HARBOR_CONTENT_BLOB_OS_BUCKET=${HARBOR_CONTENT_BLOB_OS_BUCKET:-polycentric-blobs}
      - HARBOR_CONTENT_BLOB_OS_ENDPOINT=${HARBOR_CONTENT_BLOB_OS_ENDPOINT:-http://rustfs:9000}
      - HARBOR_CONTENT_BLOB_OS_FORCE_PATH_STYLE=${HARBOR_CONTENT_BLOB_OS_FORCE_PATH_STYLE:-true}
      - HARBOR_CONTENT_BLOB_OS_ACCESS_KEY=${HARBOR_CONTENT_BLOB_OS_ACCESS_KEY:-rustfsadmin}
      - HARBOR_CONTENT_BLOB_OS_SECRET_KEY=${HARBOR_CONTENT_BLOB_OS_SECRET_KEY:-rustfsadmin}
      - HARBOR_MODERATION_IDENTITY=${HARBOR_MODERATION_IDENTITY:-}
      # Canonical name of this server. Must exactly match the server URL
      # clients use.
      - HARBOR_SERVER_NAME=${HARBOR_SERVER_NAME:-http://localhost:3000}
      # In-network listener: the default (localhost:9092) points at the server
      # container itself, making Kafka unreachable
      - HARBOR_KAFKA_BROKERS=${HARBOR_KAFKA_BROKERS:-kafka:19092}
      - HARBOR_VALKEY_URL=${HARBOR_VALKEY_URL:-redis://valkey:6379}
      # Reached over the isolated `scraper_link` network (see below).
      - HARBOR_SCRAPER_URL=${HARBOR_SCRAPER_URL:-http://scraper:8855}
      # Accepted JWT audiences (emulator needs 10.0.2.2). Defaults to SERVER_NAME.
      - HARBOR_ALLOW_HOSTS=${HARBOR_ALLOW_HOSTS:-http://localhost:3000}
    # On both the shared app network and the isolated scraper link, so it can
    # talk to postgres/kafka/etc. AND to the scraper.
    networks:
      - default
      - scraper_link
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      valkey:
        condition: service_healthy
      scraper:
        condition: service_started

  # Background workers (`server workers`): consumes the `events` topic and
  # materializes the `notifications` topic the push-notifications service
  # reads. Same image and env as the server (prod runs it the same way, see
  # deploy/charts/harbor-server/templates/workers-deployment.yaml).
  server-workers:
    profiles:
      - push
    image: ${HARBOR_SERVER_IMAGE:-harbor-server}
    build:
      context: .
      dockerfile: services/server/Dockerfile
    command: ['/app/server', 'workers']
    environment: *server-env
    networks:
      - default
      - scraper_link
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    # The entrypoint programs an nftables egress firewall inside the container's
    # network namespace before dropping privileges, so it needs NET_ADMIN.
    # `init` reaps the headless-Chromium child processes the scraper spawns.
    cap_add:
      - NET_ADMIN
    init: true
    # Isolation: attached ONLY to `scraper_link` (shared with the server), never
    # to `default`. So even if its in-container egress firewall is bypassed, it
    # has no route to postgres/kafka/rustfs/etc. — they sit on a network it
    # cannot see. Deliberately no `ports:` — it must not be published to the
    # host, as it fetches arbitrary user-supplied URLs.
    networks:
      - scraper_link
    healthcheck:
      # node:24 ships global fetch; avoids needing curl/wget in the image.
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:8855/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous: the first check waits for the headless browser to come up.
      start_period: 20s

  verifier-bot:
    build:
      context: .
      # Dockerfile.dev is self-contained: it builds every dependency from source
      # inside the image — the Rust->wasm rs-core-wasm and the JS SDKs — so
      # no host prebuild or CI artifacts are needed.
      dockerfile: services/verifier-bot/Dockerfile.dev
    ports:
      - ${HARBOR_VERIFIER_BOT_PORT:-3002}:3002
    environment:
      - HARBOR_VERIFIER_BOT_SERVERS=${HARBOR_VERIFIER_BOT_SERVERS:-http://server:3000}
      # The bot's identity persists in postgres under its own schema, so no
      # sqlite state volume is needed.
      - HARBOR_VERIFIER_BOT_DATABASE_URL=${HARBOR_VERIFIER_BOT_DATABASE_URL:-postgres://postgres:testing@postgres:5432?schema=verifier_bot}
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy

  # Opt-in, like moderation: `docker compose --profile push up -d`. Without
  # the profile the app logs a harmless connection-refused on registration.
  push-notifications:
    profiles:
      - push
    build:
      context: .
      dockerfile: services/push-notifications/Dockerfile
    ports:
      - ${HARBOR_NOTIFICATIONS_PORT:-3001}:3001
    environment:
      - RUST_LOG=debug
      - HARBOR_DATABASE_URL=${HARBOR_DATABASE_URL:-postgres://postgres:testing@postgres:5432}
      - HARBOR_KAFKA_BROKERS=${HARBOR_KAFKA_BROKERS:-kafka:19092}
      # Must exactly match the server's HARBOR_SERVER_NAME — the consumer
      # skips notifications whose Kafka SOURCE_SERVER header differs.
      - HARBOR_MAIN_SERVER=${HARBOR_SERVER_NAME:-http://localhost:3000}
      # Queried at push time for the sender's profile (name/avatar).
      - HARBOR_QUERY_SERVERS=${HARBOR_QUERY_SERVERS:-http://server:3000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      server:
        condition: service_started

  otlp:
    profiles:
      - otlp
    build:
      context: .
      dockerfile: services/otlp/Dockerfile
    ports:
      - ${HARBOR_OTLP_PORT:-3003}:3003
    environment:
      - RUST_LOG=debug
      # Accepted JWT audiences: the URL the app uses for EXPO_PUBLIC_HARBOR_OTLP_URL.
      - HARBOR_ALLOW_HOSTS=${HARBOR_OTLP_ALLOW_HOSTS:-http://localhost:3003}
      - HARBOR_QUERY_SERVERS=${HARBOR_QUERY_SERVERS:-http://server:3000}
      - HARBOR_VICTORIA_LOGS_URL=${HARBOR_VICTORIA_LOGS_URL:-http://victorialogs:9428}
      - HARBOR_VICTORIA_TRACES_URL=${HARBOR_VICTORIA_TRACES_URL:-http://victoriatraces:10428}
    depends_on:
      server:
        condition: service_started
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started

  victorialogs:
    profiles:
      - otlp
    image: victoriametrics/victoria-logs:latest
    command: ['-storageDataPath=/data']
    volumes:
      - victorialogs-data:/data
    ports:
      - ${HARBOR_VICTORIA_LOGS_PORT:-9428}:9428

  victoriatraces:
    profiles:
      - otlp
    image: victoriametrics/victoria-traces:latest
    command: ['-storageDataPath=/data']
    volumes:
      - victoriatraces-data:/data
    ports:
      - ${HARBOR_VICTORIA_TRACES_PORT:-10428}:10428

  rustfs:
    image: rustfs/rustfs:latest@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    volumes:
      - rustfs-data:/data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      # rustfs:latest refuses the default root credentials on a non-loopback listener. This
      # re-enables them so that default credentials continue to work for all dependent services.
      - RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS=true
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs-init:
    image: rustfs/rc:latest@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until rc alias set rustfs http://rustfs:9000 rustfsadmin rustfsadmin >/dev/null 2>&1; do
        echo 'waiting for rustfs...'; sleep 1;
      done;
      rc mb -p rustfs/polycentric-blobs"

  kafka:
    image: apache/kafka:latest@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - 9092:9092
    volumes:
      - kafka-data:/var/lib/kafka/data

  valkey:
    image: valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Opt-in. Needs an identity published to the server first. See
  # services/moderation/create-local-identity.sh.
  #
  # Run with `docker compose --profile moderation up -d --build moderation`
  moderation:
    profiles:
      - moderation
    build:
      context: .
      dockerfile: services/moderation/Dockerfile
    environment:
      - RUST_LOG=info
      - HARBOR_DATABASE_URL=${HARBOR_DATABASE_URL:-postgres://postgres:testing@postgres:5432}
      - HARBOR_KAFKA_BROKERS=${HARBOR_KAFKA_BROKERS:-kafka:19092}
      - HARBOR_MODERATION_IDENTITY=${HARBOR_MODERATION_IDENTITY:-}
      - HARBOR_MODERATION_SIGNING_KEY=${HARBOR_MODERATION_SIGNING_KEY:-}
      - HARBOR_MODERATION_SERVERS=${HARBOR_MODERATION_SERVERS:-http://server:3000}
      # Azure and PhotoDNA are unset, so labels come only from moderator
      # reports. Set the Azure endpoint and key together to enable scoring.
      - HARBOR_CONTENT_BLOB_OS_BUCKET=${HARBOR_CONTENT_BLOB_OS_BUCKET:-polycentric-blobs}
      - HARBOR_CONTENT_BLOB_OS_ENDPOINT=${HARBOR_CONTENT_BLOB_OS_ENDPOINT:-http://rustfs:9000}
      - HARBOR_CONTENT_BLOB_OS_FORCE_PATH_STYLE=${HARBOR_CONTENT_BLOB_OS_FORCE_PATH_STYLE:-true}
      - HARBOR_CONTENT_BLOB_OS_ACCESS_KEY=${HARBOR_CONTENT_BLOB_OS_ACCESS_KEY:-rustfsadmin}
      - HARBOR_CONTENT_BLOB_OS_SECRET_KEY=${HARBOR_CONTENT_BLOB_OS_SECRET_KEY:-rustfsadmin}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      server:
        condition: service_started

  kafka-ui:
    image: docker.redpanda.com/redpandadata/console:latest@sha256:d72608f64c65a5631adca6c99b44d157cefb9edb0473ed58451f91affcfcfa1b
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
      KAFKA_BROKERS: kafka:19092
    ports:
      - 8080:8080
    depends_on:
      - kafka
    volumes:
      - ./kafka-ui.yml:/etc/console/config.yaml
      - ./protos:/proto

networks:
  # The implicit network all the app services share (postgres, kafka, …).
  default:
  # Isolated bridge shared ONLY by the server and the scraper. The scraper is
  # deliberately not attached to `default`, so a compromised scraper has no
  # network route to the other containers regardless of its in-container
  # firewall — they are not reachable on any network it is a member of.
  scraper_link:

volumes:
  postgres-data:
  rustfs-data:
  kafka-data:
  victorialogs-data:
  victoriatraces-data:
