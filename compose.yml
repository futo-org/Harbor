services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: testing
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:2.1.0
    ports:
      - '127.0.0.1:9200:9200'
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - bootstrap.memory_lock=true
      - 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m'
      - 'DISABLE_INSTALL_DEMO_CONFIG=true'
      - 'DISABLE_SECURITY_PLUGIN=true'
      - 'discovery.type=single-node'
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  legacy-server:
    build:
      context: .
      dockerfile: legacy/services/polycentric-server/Dockerfile
    ports:
      - '127.0.0.1:${POLYCENTRIC_PORT:-8787}:8787'
    environment:
      - RUST_LOG=debug
      - DATABASE_URL=postgres://postgres:testing@postgres:5432
      - OPENSEARCH_STRING=http://opensearch:9200
      - ADMIN_TOKEN=123
      - CHALLENGE_KEY=456
      - STATSD_ADDRESS=127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  legacy-verifiers:
    build: ./legacy/services/verifiers-server
    working_dir: /app/legacy/services/verifiers-server
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:${VERIFIERS_PORT:-3002}:3002'
    environment:
      - SERVER_URL=http://legacy-server:8787
    command: sh -c "npm install && npx nodemon src/app.ts"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
