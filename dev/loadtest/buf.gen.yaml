# Go code for dev/loadtest from the repo's protos. Run from the repo root:
#   dev/loadtest/scripts/generate-protos.sh
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: code.futo.org/harbor/harbor/dev/loadtest/internal/pb
plugins:
  - local: protoc-gen-go
    out: dev/loadtest/internal/pb
    opt:
      - module=code.futo.org/harbor/harbor/dev/loadtest/internal/pb
inputs:
  - directory: protos
    paths:
      - protos/polycentric/v2
