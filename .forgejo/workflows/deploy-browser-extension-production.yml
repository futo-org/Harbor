name: Deploy browser extension to production

# Builds the production extension for every browser from the default branch's
# head, submits it to the stores and uploads the builds to the static bucket.

on:
  workflow_dispatch:

enable-openid-connect: true

concurrency:
  group: deploy-browser-extension-production
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  SCCACHE_R2_BUCKET: ${{ vars.SCCACHE_R2_BUCKET }}

jobs:
  changes:
    name: Plan
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      images_tag: ${{ steps.plan.outputs.images_tag }}
      images_missing: ${{ steps.plan.outputs.images_missing }}
      have_wasm: ${{ steps.plan.outputs.have_wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/plan
        id: plan

  setup-images:
    name: Build CI images
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:26-alpine' }}
    steps:
      - name: Install git
        run: apk add --no-cache git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_PROD_ID }}
          environment: prod
      - uses: ./.forgejo/actions/ci-images
        if: needs.changes.outputs.images_missing == 'true'
        with:
          registry: ${{ needs.changes.outputs.registry }}
          tag: ${{ needs.changes.outputs.images_tag }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ env.REGISTRY_TOKEN }}
          cosign-key: ${{ env.COSIGN_PRIVATE_KEY }}

  # wasm only when the registry has no copy for these sources.
  wasm:
    name: Build wasm
    needs: [ changes, setup-images ]
    if: ${{ !cancelled() && needs.changes.outputs.have_wasm != 'true' && needs.setup-images.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container:
      image: ${{ needs.changes.outputs.registry }}/ci/rust:${{ needs.changes.outputs.images_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_PROD_ID }}
          environment: prod
      - uses: ./.forgejo/actions/wasm-build
      - uses: ./.forgejo/actions/r2-cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          mode: save
          key: ${{ env.RUST_CACHE_KEY }}
          path: ${{ env.RUST_CACHE_PATHS }}

  sdks:
    name: Build SDKs
    needs: [ changes, wasm ]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
      (needs.wasm.result == 'success' || needs.changes.outputs.have_wasm == 'true') }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_PROD_ID }}
          environment: prod
      - uses: ./.forgejo/actions/sdk-build
        with:
          registry: ${{ needs.changes.outputs.registry }}
          wasm-artifact: ${{ needs.wasm.result == 'success' }}
          rn-sdk: "true"
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ env.REGISTRY_TOKEN }}

  # The extension has no server to set its config at runtime, so the production
  # services are packaged in (harbor-infra's prod cluster-settings).
  build:
    name: Build
    needs: sdks
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    env:
      EXPO_PUBLIC_APP_VARIANT: production
      EXPO_PUBLIC_HARBOR_APP_URL: https://harbor.social
      EXPO_PUBLIC_HARBOR_SEED_SERVERS: https://srv.harbor.social,https://srv.polycentric.io
      EXPO_PUBLIC_HARBOR_NOTIFICATION_SERVERS: https://push.harbor.social
      EXPO_PUBLIC_HARBOR_VERIFIER_SERVERS: https://verifier-bot.harbor.social
      EXPO_PUBLIC_HARBOR_OTLP_URL: https://otlp.harbor.social
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/browser-extension-build
        with:
          variant: production

  safari:
    name: Build Safari app
    needs: build
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'macos' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/safari-extension-build
        with:
          variant: production

  # Safari is not submitted: its app is unsigned.
  store-deploy:
    name: ${{ matrix.label }}
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: chrome
            label: Submit to the Chrome Web Store
          - store: firefox
            label: Submit to Firefox Add-ons
          - store: edge
            label: Submit to Edge Add-ons
    env:
      CHROME_API_VERSION: v2
      CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID_PRODUCTION }}
      CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ vars.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      # A build still in review gives way to this one.
      CHROME_CANCEL_PENDING: "true"
      # The gecko id in apps/harbor-browser-extension/wxt.config.ts
      FIREFOX_EXTENSION_ID: anywhere@harbor.social
      FIREFOX_CHANNEL: listed
      EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID_PRODUCTION }}
      EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_PROD_ID }}
          environment: prod
      - uses: ./.forgejo/actions/browser-extension-submit
        with:
          variant: production
          store: ${{ matrix.store }}

  # Runs without the Safari app when its build failed.
  static-deploy:
    name: Deploy to the static bucket
    needs: [ build, safari ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    env:
      UPDATE_CHANNEL: production
      STATIC_S3_BUCKET: ${{ vars.STATIC_S3_BUCKET }}
      STATIC_PUBLIC_BASE_URL: ${{ vars.STATIC_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_PROD_ID }}
          environment: prod
      - uses: forgejo/download-artifact@v4
        with:
          name: browser-extension-production
          path: apps/harbor-browser-extension/dist
      - uses: forgejo/download-artifact@v4
        if: needs.safari.result == 'success'
        with:
          name: browser-extension-safari-production
          path: apps/harbor-browser-extension/dist
      - name: Publish the builds
        run: node .forgejo/scripts/publish-browser-extension.mjs
