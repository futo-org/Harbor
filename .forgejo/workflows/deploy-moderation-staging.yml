name: Deploy moderation to staging

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - Cargo.toml
      - Cargo.lock
      - services/moderation/**
      - services/common/**
      - deploy/charts/harbor-moderation/**
      - .forgejo/workflows/deploy-moderation-staging.yml
      - .forgejo/actions/rust-binaries/**
      - .forgejo/actions/rust-env/**
      - .forgejo/actions/r2-cache/**
      - .forgejo/actions/service-image/**
      - .forgejo/actions/chart-publish/**
      - .forgejo/actions/deploy-tag/**

concurrency:
  group: deploy-moderation-staging
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  SCCACHE_R2_BUCKET: ${{ vars.SCCACHE_R2_BUCKET }}
  SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
  SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

jobs:
  binaries:
    name: Build binaries
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}/ci/rust:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/rust-binaries
        with:
          packages: moderation-service moderation-migration

  deploy:
    name: Deploy
    needs: binaries
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}/ci/buildkit:latest
    env:
      REGISTRY: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: forgejo/download-artifact@v4
        with:
          name: rust-service-binaries
          path: service-bin
      - uses: ./.forgejo/actions/service-image
        with:
          image: moderation-service
          dockerfile: services/moderation
          registry: ${{ env.REGISTRY }}
          binaries: service-bin
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
      - uses: ./.forgejo/actions/chart-publish
        id: chart
        with:
          registry: ${{ env.REGISTRY }}
          chart: harbor-moderation
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
      - uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: moderation-service
          chart: harbor-moderation
          chart-version: ${{ steps.chart.outputs.version }}
          environment: staging
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
