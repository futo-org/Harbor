name: Deploy grayjay migrator to staging

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - Cargo.toml
      - Cargo.lock
      - services/grayjay-migrator/**
      - services/moderation/entity/**
      - services/common/**
      - deploy/charts/harbor-grayjay-migrator/**
      - .forgejo/workflows/deploy-grayjay-migrator-staging.yml
      - .forgejo/actions/rust-binaries/**
      - .forgejo/actions/stage-artifact/**
      - .forgejo/actions/rust-env/**
      - .forgejo/actions/r2-cache/**
      - .forgejo/actions/service-image/**
      - .forgejo/actions/chart-publish/**
      - .forgejo/actions/deploy-tag/**

enable-openid-connect: true

concurrency:
  group: deploy-grayjay-migrator-staging
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_R2_BUCKET: ${{ vars.SCCACHE_R2_BUCKET }}

jobs:
  binaries:
    name: Build binaries
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}/ci/rust:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_STAGING_ID }}
          environment: staging
          env: SCCACHE_R2_ACCESS_KEY_ID SCCACHE_R2_ENDPOINT SCCACHE_R2_SECRET_ACCESS_KEY
      - uses: ./.forgejo/actions/rust-binaries
        with:
          packages: grayjay-migrator grayjay-migrator-migration

  deploy:
    name: Deploy
    needs: binaries
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}/ci/buildkit:latest
    env:
      REGISTRY: ${{ vars.CI_REGISTRY || 'registry.futo.org/harbor' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_STAGING_ID }}
          environment: staging
          secrets: COSIGN_PRIVATE_KEY REGISTRY_TOKEN
      - uses: ./.forgejo/actions/service-image
        with:
          image: grayjay-migrator
          dockerfile: services/grayjay-migrator
          registry: ${{ env.REGISTRY }}
          stage-artifact: rust-service-binaries
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ steps.secrets.outputs.REGISTRY_TOKEN }}
          cosign-key: ${{ steps.secrets.outputs.COSIGN_PRIVATE_KEY }}
      - uses: ./.forgejo/actions/chart-publish
        id: chart
        with:
          registry: ${{ env.REGISTRY }}
          chart: harbor-grayjay-migrator
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ steps.secrets.outputs.REGISTRY_TOKEN }}
          cosign-key: ${{ steps.secrets.outputs.COSIGN_PRIVATE_KEY }}
      - uses: ./.forgejo/actions/deploy-tag
        with:
          registry: ${{ env.REGISTRY }}
          image: grayjay-migrator
          chart: harbor-grayjay-migrator
          chart-version: ${{ steps.chart.outputs.version }}
          environment: staging
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ steps.secrets.outputs.REGISTRY_TOKEN }}
