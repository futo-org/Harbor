name: Docs preview cleanup

# GitLab deploy_docs.yml docs-review-stop.

on:
  pull_request:
    types: [closed]
    paths:
      - 'docs/**'

jobs:
  docs-review-stop:
    name: Remove docs preview
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:24-bookworm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete the preview
        run: node .forgejo/scripts/cf-pages-delete-branch.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: polycentric-docs
          CF_PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
