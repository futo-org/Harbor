name: Docs preview cleanup

# GitLab deploy_docs.yml docs-review-stop.

on:
  pull_request:
    types: [ closed ]
    paths:
      - "docs/**"

enable-openid-connect: true

jobs:
  docs-review-stop:
    name: Remove docs preview
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_DEV_ID }}
          environment: global
      - name: Delete the preview
        run: node .forgejo/scripts/cf-pages-delete-branch.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: polycentric-docs
          CF_PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
