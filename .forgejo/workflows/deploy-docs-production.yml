name: Deploy docs to production

# GitLab deploy_docs.yml. PR previews are pr.yml's docs-preview job.

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - docs/**
      - protos/polycentric/v2/**
      - buf.yaml
      - .forgejo/workflows/deploy-docs-production.yml
      - .forgejo/actions/setup-pnpm/**

enable-openid-connect: true

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

env:
  INFISICAL_IDENTITY: ${{ vars.INFISICAL_HARBOR_CI_PLAN_PROD_ID }}
  INFISICAL_ENVIRONMENT: prod

jobs:
  deploy:
    name: Deploy
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          secrets: CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter=polycentric-docs...
      - name: Build
        run: pnpm --filter=polycentric-docs run build
      - name: Install wrangler
        run: npm install -g wrangler # zizmor: ignore[adhoc-packages]
      - name: Deploy
        run: wrangler pages deploy ./docs/build --project-name=polycentric-docs --branch=production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.secrets.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets.outputs.CLOUDFLARE_API_TOKEN }}
