name: Deploy store listing

# Pushes apps/harbor/marketing (text and screenshots, rendered locally and
# committed) to App Store Connect and Google Play. Binaries are the release
# workflow's job; this only touches the listings.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate against the stores without writing anything
        type: boolean
        default: false
      version:
        description: App Store version to create when none is editable (for example 1.4.0)
        default: ""
  push:
    branches: [ develop ]
    paths:
      - apps/harbor/marketing/**
      - .forgejo/scripts/publish-app-store-listing.mjs
      - .forgejo/scripts/publish-play-listing.mjs
      - .forgejo/workflows/deploy-store-listing.yml

enable-openid-connect: true

concurrency:
  group: deploy-store-listing
  cancel-in-progress: false

jobs:
  check:
    name: Check exports
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    timeout-minutes: 5
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Listing files match source/listing.mjs
        run: node apps/harbor/marketing/source/export.mjs --check

  app-store:
    name: App Store Connect
    needs: check
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    timeout-minutes: 30
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    env:
      ASC_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_PROD_ID }}
          environment: prod
      - name: Push listing
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = true ]; then FLAGS="--dry-run"; fi
          node .forgejo/scripts/publish-app-store-listing.mjs $FLAGS

  play:
    name: Google Play
    needs: check
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    timeout-minutes: 30
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        with:
          identity: ${{ vars.INFISICAL_HARBOR_CI_PLAN_PROD_ID }}
          environment: prod
      - name: Push listing
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = true ]; then FLAGS="--dry-run"; fi
          node .forgejo/scripts/publish-play-listing.mjs $FLAGS
