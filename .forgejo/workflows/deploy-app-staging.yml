name: Deploy app to staging

# GitLab build_app.yml (EAS) and deploy_app.yml (app), staging channel.

on:
  workflow_dispatch:
    inputs:
      ios_e2e:
        description: Run the iOS e2e suite on the store build
        type: boolean
        default: false
  push:
    branches: [ develop ]
    paths:
      - pnpm-lock.yaml
      - apps/**
      - .forgejo/workflows/deploy-app-staging.yml
      - .forgejo/actions/plan/**
      - .forgejo/actions/ci-images/**
      - .forgejo/actions/android-build/**
      - .forgejo/actions/ios-build/**
      - .forgejo/actions/sdk-build/**
      - .forgejo/actions/eas-build/**
      - .forgejo/scripts/**

enable-openid-connect: true

concurrency:
  group: deploy-app-staging
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  SCCACHE_R2_BUCKET: ${{ vars.SCCACHE_R2_BUCKET }}
  INFISICAL_IDENTITY: ${{ vars.INFISICAL_HARBOR_CI_PLAN_STAGING_ID }}
  INFISICAL_ENVIRONMENT: staging

jobs:
  changes:
    name: Plan
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      images_tag: ${{ steps.plan.outputs.images_tag }}
      images_missing: ${{ steps.plan.outputs.images_missing }}
      have_wasm: ${{ steps.plan.outputs.have_wasm }}
      have_android: ${{ steps.plan.outputs.have_android }}
      have_ios: ${{ steps.plan.outputs.have_ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/plan
        id: plan

  setup-images:
    name: Build CI images
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_TOOLS_IMAGE || 'node:26-alpine' }}
    steps:
      - name: Install git
        run: apk add --no-cache git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          secrets: COSIGN_PRIVATE_KEY REGISTRY_TOKEN
      - uses: ./.forgejo/actions/ci-images
        if: needs.changes.outputs.images_missing == 'true'
        with:
          registry: ${{ needs.changes.outputs.registry }}
          tag: ${{ needs.changes.outputs.images_tag }}
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ steps.secrets.outputs.REGISTRY_TOKEN }}
          cosign-key: ${{ steps.secrets.outputs.COSIGN_PRIVATE_KEY }}

  # The rs-core libraries (the JS SDKs need wasm too), unless the registry has
  # them for these sources.
  wasm:
    name: Build wasm
    needs: [ changes, setup-images ]
    if: ${{ !cancelled() && needs.changes.outputs.have_wasm != 'true' && needs.setup-images.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container:
      image: ${{ needs.changes.outputs.registry }}/ci/rust:${{ needs.changes.outputs.images_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/wasm-build
      - uses: ./.forgejo/actions/r2-cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          mode: save
          key: ${{ env.RUST_CACHE_KEY }}
          path: ${{ env.RUST_CACHE_PATHS }}

  android:
    name: Build Android
    needs: [ changes, setup-images ]
    if: ${{ !cancelled() && needs.changes.outputs.have_android != 'true' && needs.setup-images.result != 'failure' }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container:
      image: ${{ needs.changes.outputs.registry }}/ci/rust-android:${{ needs.changes.outputs.images_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/android-build
      - uses: ./.forgejo/actions/r2-cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          mode: save
          key: ${{ env.RUST_CACHE_KEY }}
          path: ${{ env.RUST_CACHE_PATHS }}

  ios:
    name: Build iOS
    needs: changes
    if: needs.changes.outputs.have_ios != 'true'
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'macos' }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/ios-build

  sdks:
    name: Build SDKs
    needs: [ changes, wasm, android, ios ]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
      (needs.wasm.result == 'success' || needs.changes.outputs.have_wasm == 'true') &&
      (needs.android.result == 'success' || needs.changes.outputs.have_android == 'true') &&
      (needs.ios.result == 'success' || needs.changes.outputs.have_ios == 'true') }}
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          secrets: REGISTRY_TOKEN
      - uses: ./.forgejo/actions/sdk-build
        with:
          registry: ${{ needs.changes.outputs.registry }}
          natives: android ios
          wasm-artifact: ${{ needs.wasm.result == 'success' }}
          android-artifact: ${{ needs.android.result == 'success' }}
          ios-artifact: ${{ needs.ios.result == 'success' }}
          rn-sdk: "true"
          registry-user: ${{ vars.REGISTRY_USER }}
          registry-token: ${{ steps.secrets.outputs.REGISTRY_TOKEN }}

  # Store builds only queue on EAS, so their submit jobs follow right away
  # and EAS waits for the build itself.
  store:
    name: ${{ matrix.label }}
    needs: sdks
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            name: app-android-aab-staging
            label: Build Android AAB
          - platform: ios
            name: app-ios-staging
            label: Build iOS app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          secrets: EXPO_TOKEN
      - uses: ./.forgejo/actions/eas-build
        with:
          platform: ${{ matrix.platform }}
          profile: staging
        env:
          EXPO_TOKEN: ${{ steps.secrets.outputs.EXPO_TOKEN }}
      - uses: forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/harbor/eas-build.json
          retention-days: 7

  apk:
    name: Build Android APK
    needs: sdks
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          secrets: EXPO_TOKEN
      - uses: ./.forgejo/actions/eas-build
        with:
          platform: android
          profile: staging-apk
          wait: "true"
        env:
          EXPO_TOKEN: ${{ steps.secrets.outputs.EXPO_TOKEN }}
      - uses: forgejo/upload-artifact@v4
        with:
          name: app-android-apk-staging
          path: |
            apps/harbor/eas-build.json
            apps/harbor/harbor.apk
          retention-days: 7

        # eas-cli needs the expo project config even when submitting by id.
        env:
          EXPO_TOKEN: ${{ steps.secrets.outputs.EXPO_TOKEN }}
  store-deploy:
    name: ${{ matrix.label }}
    needs: store
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            build: app-android-aab-staging
            label: Deploy Android app
          - platform: ios
            build: app-ios-staging
            label: Deploy iOS app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          secrets: EXPO_TOKEN
      - uses: forgejo/download-artifact@v4
        with:
          name: ${{ matrix.build }}
          path: apps/harbor
      - uses: ./.forgejo/actions/setup-pnpm
        with:
          install-args: --filter polycentric-app...
      - name: Submit to the store
        working-directory: apps/harbor
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPO_TOKEN: ${{ steps.secrets.outputs.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -p "[].concat(JSON.parse(require('fs').readFileSync('eas-build.json', 'utf8')))[0].id")
          npx eas-cli submit --platform "$PLATFORM" --profile staging --id "$BUILD_ID" --non-interactive --no-wait

  apk-deploy:
    name: Deploy APK
    needs: apk
    runs-on: ${{ vars.CI_RUNNER || 'docker' }}
    container: ${{ vars.CI_NODE_IMAGE || 'node:26-bookworm' }}
    env:
      UPDATE_CHANNEL: staging
      STATIC_S3_BUCKET: ${{ vars.STATIC_S3_BUCKET }}
      STATIC_PUBLIC_BASE_URL: ${{ vars.STATIC_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          secrets: OPEN_ROUTER_API_TOKEN STATIC_S3_ACCESS_KEY_ID STATIC_S3_ENDPOINT STATIC_S3_SECRET_ACCESS_KEY
      - uses: forgejo/download-artifact@v4
        with:
          name: app-android-apk-staging
          path: apps/harbor
      # Notes since the last release; the publish step falls back to the
      # commit title if they could not be written.
      - name: Release notes
        continue-on-error: true
        env:
          OPEN_ROUTER_API_TOKEN: ${{ steps.secrets.outputs.OPEN_ROUTER_API_TOKEN }}
        run: node .forgejo/scripts/release-notes.mjs release_notes.md
      - name: Publish the APK
        run: |
          export CI_COMMIT_SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          export CI_COMMIT_TITLE=$(git log -1 --format=%s)
          node .forgejo/scripts/publish-android-update.mjs

        # An empty matrix creates no job; an `if` would wait for the device runner.
        env:
          STATIC_S3_ACCESS_KEY_ID: ${{ steps.secrets.outputs.STATIC_S3_ACCESS_KEY_ID }}
          STATIC_S3_ENDPOINT: ${{ steps.secrets.outputs.STATIC_S3_ENDPOINT }}
          STATIC_S3_SECRET_ACCESS_KEY: ${{ steps.secrets.outputs.STATIC_S3_SECRET_ACCESS_KEY }}
  ios-e2e:
    name: Test iOS e2e
    needs: store
    runs-on: ${{ vars.CI_RUNNER_IOS_DEVICE || 'ios-device' }}
    continue-on-error: true
    strategy:
      matrix: ${{ inputs.ios_e2e && fromJSON('{"include":[{"channel":"staging"}]}') || fromJSON('{"include":[]}') }}
    env:
      MAESTRO_OUTPUT: reports
      MAESTRO_APP_ID: org.futo.polycentric.staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.forgejo/actions/infisical-secrets
        id: secrets
        with:
          secrets: EXPO_TOKEN
      - uses: forgejo/download-artifact@v4
        with:
          name: app-ios-staging
          path: apps/harbor
      - name: Install dependencies
        run: pnpm install --filter harbor-e2e... --filter polycentric-app...
      - name: Resign the store build and run iOS e2e
        run: |
          cd apps/harbor
          BUILD_ID=$(node -p "[].concat(JSON.parse(require('fs').readFileSync('eas-build.json', 'utf8')))[0].id")
          node "$GITHUB_WORKSPACE/tools/expo/resign-build.js" "$BUILD_ID" --output harbor.ipa
          MAESTRO_APP_FILE="$PWD/harbor.ipa" pnpm --filter harbor-e2e test:ios
        env:
          EXPO_TOKEN: ${{ steps.secrets.outputs.EXPO_TOKEN }}
      - uses: forgejo/upload-artifact@v4
        if: always()
        with:
          name: e2e-ios-staging-report
          path: e2e/reports
          retention-days: 7
