name: service-image
description: Rootless BuildKit build pushed as <registry>/<image>:<sha>. The stage artifact (stage-artifact, from rust-binaries or js-build) stands in for the Dockerfile's build stage, so only the runtime stage builds here. Runs in the ci/buildkit job image, the build itself as its `user`.
inputs:
  image:
    description: Image name under the registry (server, moderation-service, web, ...)
    required: true
  dockerfile:
    description: Directory holding the Dockerfile; the build context is the repo root
    required: true
  registry:
    required: true
  build-args:
    description: One KEY=VALUE per line
    default: ''
  stage-artifact:
    description: Artifact put in place of the Dockerfile stage `stage`
    required: true
  stage:
    description: Dockerfile stage the artifact replaces
    default: builder
  registry-user:
    required: true
  registry-token:
    required: true
  cosign-key:
    description: COSIGN_PRIVATE_KEY; the pushed image is signed with it (empty skips)
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/registry-login
      with:
        registry: ${{ inputs.registry }}
        registry-user: ${{ inputs.registry-user }}
        registry-token: ${{ inputs.registry-token }}
    - uses: forgejo/download-artifact@v4
      with:
        name: ${{ inputs.stage-artifact }}
        path: .stage
    - shell: bash
      run: install -d .stage/context && tar -xf .stage/stage.tar -C .stage/context --no-same-owner
    - shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUILD_ARGS: ${{ inputs.build-args }}
        STAGE: ${{ inputs.stage }}
      run: |
        # The image sets HOME=/home/user for root too, so the login usually landed there already.
        if [ -f ~/.docker/config.json ] && [ ! ~/.docker/config.json -ef /home/user/.docker/config.json ]; then
          install -d /home/user/.docker
          install -m 0600 ~/.docker/config.json /home/user/.docker/config.json
        fi
        chown -R user:user /home/user
        # rootlesskit refuses root, which the job's steps run as.
        build() {
          su -s /bin/bash user -c "cd $(printf '%q' "$PWD") && exec env HOME=/home/user XDG_RUNTIME_DIR=/run/user/1000 TMPDIR=/home/user/.local/tmp BUILDKITD_FLAGS=--oci-worker-no-process-sandbox buildctl-daemonless.sh build $(printf '%q ' "$@")"
        }
        # Without a per-commit label a fully cached build is byte-identical to
        # the previous one and containerd reports the older pull's digest.
        set -- --opt "label:org.opencontainers.image.revision=$GITHUB_SHA"
        while IFS= read -r arg; do
          [ -n "$arg" ] && set -- "$@" --opt "build-arg:$arg"
        done <<< "$BUILD_ARGS"
        # The named context stands in for the build stage, which never runs.
        # The runtime stage's layers (apt installs) come from the cache
        # metadata inlined in the :staging image, so there is no separate
        # cache upload. zstd compresses new layers faster than gzip, and
        # smaller, so less goes up to the registry.
        build "$@" --frontend dockerfile.v0 --local context=. --local "dockerfile=$DOCKERFILE" \
          --local stage=.stage/context --opt "context:$STAGE=local:stage" \
          --import-cache "type=registry,ref=$IMAGE:staging" --export-cache type=inline \
          --output "type=image,name=$IMAGE:$GITHUB_SHA,push=true,compression=zstd"
    # Sign the commit's image by digest; the moving tags share that digest.
    - uses: ./.forgejo/actions/cosign-sign
      with:
        refs: ${{ inputs.registry }}/${{ inputs.image }}:${{ github.sha }}
        key: ${{ inputs.cosign-key }}
