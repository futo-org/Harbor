name: infisical-secrets
description: Log in to Infisical with the job's OIDC token and return the named CI secrets as step outputs
inputs:
  secrets:
    description: Names of the secrets to fetch, separated by whitespace
    required: true
  identity:
    description: Infisical machine identity to log in as (default INFISICAL_IDENTITY, set by the workflow)
    default: ""
  environment:
    description: Infisical environment to read besides global, staging or prod (default INFISICAL_ENVIRONMENT)
    default: ""
runs:
  using: node24
  main: index.js
