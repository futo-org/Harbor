name: infisical-secrets
description: Log in to Infisical with the job's OIDC token and fetch the named CI secrets
inputs:
  identity:
    description: Infisical machine identity to log in as
    required: true
  environment:
    description: Infisical environment to read besides global (staging or prod, from protected refs only)
    default: ""
  secrets:
    description: Names to return as step outputs, for the steps that reference them
    default: ""
  env:
    description: Names to export to the job environment, for tools that read them from there
    default: ""
runs:
  using: node24
  main: index.js
