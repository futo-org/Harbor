name: safari-extension-build
description: Wraps the Safari build of the browser-extension-<variant> artifact in a macOS app (Safari only loads an extension from inside one), uploaded as browser-extension-safari-<variant>. macOS runner with Xcode. The app is unsigned.
inputs:
  variant:
    description: APP_VARIANT (dev, staging or production)
    required: true
runs:
  using: composite
  steps:
    - uses: forgejo/download-artifact@v4
      with:
        name: browser-extension-${{ inputs.variant }}
        path: safari
    - name: Build the Safari app
      shell: bash
      working-directory: safari
      env:
        VARIANT: ${{ inputs.variant }}
      run: |
        # Names as in apps/harbor-browser-extension/wxt.config.ts
        case "$VARIANT" in
          dev) APP_NAME="Harbor Anywhere Dev" BUNDLE_ID=org.futo.polycentric.anywhere.dev ;;
          staging) APP_NAME="Harbor Anywhere Staging" BUNDLE_ID=org.futo.polycentric.anywhere.staging ;;
          *) APP_NAME="Harbor Anywhere" BUNDLE_ID=org.futo.polycentric.anywhere ;;
        esac
        unzip -q ./*-safari.zip -d extension
        xcrun safari-web-extension-converter extension \
          --project-location project \
          --app-name "$APP_NAME" \
          --bundle-identifier "$BUNDLE_ID" \
          --macos-only --copy-resources --no-open --no-prompt --force
        # The converter gives the app target <prefix>.<App-Name> instead of the requested id
        sed -i '' -E "/\.Extension/! s/(PRODUCT_BUNDLE_IDENTIFIER = ).*;/\1$BUNDLE_ID;/" \
          "project/$APP_NAME/$APP_NAME.xcodeproj/project.pbxproj"
        xcodebuild -project "project/$APP_NAME/$APP_NAME.xcodeproj" -alltargets \
          -configuration Release SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO
        ditto -c -k --keepParent "build/Release/$APP_NAME.app" harbor-anywhere-safari.zip
    - uses: forgejo/upload-artifact@v4
      with:
        name: browser-extension-safari-${{ inputs.variant }}
        path: safari/harbor-anywhere-safari.zip
        retention-days: 7
