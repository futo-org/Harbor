name: rust-binaries
description: Release-builds Rust service packages in the ci/rust job image with the rust-env caches, and uploads their executables as an artifact under out/. service-image's `binaries` input puts them in place of the Dockerfile's builder stage.
inputs:
  packages:
    description: Cargo packages to build, whitespace separated
    required: true
  artifact:
    description: Artifact name
    default: rust-service-binaries
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/rust-env
      with:
        cache: service-binaries
    - name: Build
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        args=()
        for package in $PACKAGES; do args+=(--package "$package"); done
        install -d service-bin/out
        cargo build --release "${args[@]}" --message-format=json-render-diagnostics |
          node -e 'require("readline").createInterface({ input: process.stdin }).on("line", (line) => {
            const message = JSON.parse(line);
            if (message.reason === "compiler-artifact" && message.executable) console.log(message.executable);
          })' |
          xargs -r cp -t service-bin/out/
        ls -l service-bin/out
    - uses: ./.forgejo/actions/r2-cache
      continue-on-error: true
      with:
        mode: save
        key: ${{ env.RUST_CACHE_KEY }}
        path: ${{ env.RUST_CACHE_PATHS }}
    - uses: forgejo/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: service-bin/
        retention-days: 1
