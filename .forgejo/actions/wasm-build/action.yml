name: wasm-build
description: js-wasm release build (wasm-release profile optimized with wasm-opt), plus generated react-native bindings from rs-core, uploaded as js-wasm-build (GitLab build_rs_core.yml). ci/rust job image; save the Rust cache after it.
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/rust-env
      with:
        cache: wasm
    - uses: ./.forgejo/actions/setup-pnpm
      with:
        install: "false"
    - shell: bash
      run: pnpm install --filter @polycentric/js-wasm
    - shell: bash
      run: pnpm --filter @polycentric/js-wasm build --profile wasm-release
    - shell: bash
      run: |
        wasm=packages/js/drivers/js-wasm/src/generated/wasm/polycentric_core.wasm
        before=$(stat -c%s "$wasm")
        wasm-opt -Oz -g "$wasm" -o "$wasm"
        echo "wasm-opt: $before -> $(stat -c%s "$wasm") bytes"
    - shell: bash
      run: pnpm --filter @polycentric/react-native-sdk generate
    - uses: forgejo/upload-artifact@v4
      with:
        name: js-wasm-build
        path: |
          packages/js/drivers/js-wasm/src/generated/wasm
          packages/js/drivers/js-wasm/dist
          packages/js/react-native-sdk/src/generated
          packages/js/react-native-sdk/src/NativeReactNativeSdk.ts
          packages/js/react-native-sdk/src/uniffi-init.tsx
          packages/js/react-native-sdk/cpp
          packages/js/react-native-sdk/ios/ReactNativeSdk.h
          packages/js/react-native-sdk/ios/ReactNativeSdk.mm
          packages/js/react-native-sdk/ReactNativeSdk.podspec
          packages/js/react-native-sdk/android/CMakeLists.txt
          packages/js/react-native-sdk/android/build.gradle
          packages/js/react-native-sdk/android/cpp-adapter.cpp
          packages/js/react-native-sdk/android/src/main/AndroidManifest.xml
          packages/js/react-native-sdk/android/src/main/java
        retention-days: 7
