name: wasm-build
description: rs-core-wasm release build (wasm-release profile optimized with wasm-opt), uploaded as rs-core-wasm-build (GitLab build_rs_core.yml). ci/rust job image; save the Rust cache after it.
runs:
  using: composite
  steps:
    - uses: ./.forgejo/actions/rust-env
      with:
        cache: wasm
    - uses: ./.forgejo/actions/setup-pnpm
      with:
        install: "false"
    - shell: bash
      run: pnpm install --filter @polycentric/rs-core-wasm
    - shell: bash
      run: pnpm --filter @polycentric/rs-core-wasm build --profile wasm-release
    - shell: bash
      run: |
        wasm=packages/rs-core-wasm/src/generated/wasm/polycentric_core.wasm
        before=$(stat -c%s "$wasm")
        wasm-opt -Oz -g "$wasm" -o "$wasm"
        echo "wasm-opt: $before -> $(stat -c%s "$wasm") bytes"
    - uses: forgejo/upload-artifact@v4
      with:
        name: rs-core-wasm-build
        path: |
          packages/rs-core-wasm/src/generated/wasm
          packages/rs-core-wasm/dist
        retention-days: 7
