[package]
name = "polycentric-core"
version = "0.0.0"
edition = "2024"
description = "Rust core for the Polycentric protocol"
license-file = "../../LICENSE"
repository = ""

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["native-transport"]
native-transport = [
    "tonic/transport",
    "tonic/channel",
    "tonic/tls-ring",
    "tonic/tls-webpki-roots",
    "dep:tokio",
]

[dependencies]
thiserror.workspace = true
prost.workspace = true
prost-types.workspace = true
rand = "0.8"
polycentric-common.workspace = true
getrandom = "0.2"
sha2.workspace = true
image = "0.25.10"
async-trait = "0.1"
futures = "0.3"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
tonic.workspace = true
ed25519-dalek.workspace = true
hmac-sha256.workspace = true
base64.workspace = true
uniffi.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
tonic-web-wasm-client = "0.9"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
uniffi = { workspace = true, features = ["build"] }

[build-dependencies]
prost-build.workspace = true
