[package]
name = "polycentric-core"
version = "0.0.0"
edition = "2021"
description = "Rust core for the Polycentric protocol"
license-file = "../../LICENSE"
repository = ""

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["native-transport"]
native-transport = [
    "tonic/transport",
    "tonic/channel",
    "tonic/tls-ring",
    "tonic/tls-webpki-roots",
    "dep:tokio",
]

[dependencies]
thiserror = "2.0"
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
polycentric-common = { path = "../rs-common" }
getrandom = "0.2"
sha2 = "0.10"
image = "0.25.10"
async-trait = "0.1"
futures = "0.3"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
ed25519-dalek = "2.2.0"
hmac-sha256 = "1.1.12"
base64 = "0.22.1"
uniffi.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
tonic-web-wasm-client = "0.9"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
uniffi = { workspace = true, features = ["build"] }

[build-dependencies]
prost-build = "0.14"
