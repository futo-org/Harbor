[package]
name = "polycentric-core"
version = "0.0.0"
edition = "2021"
description = "Rust core for the Polycentric protocol"
license-file = "../../LICENSE"
repository = ""

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "2.0"
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
polycentric-common = { path = "../rs-common" }
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
image = "0.25.10"

# FFI
libc = { version = "0.2.172", optional = true }

# WASM
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
tonic-web-wasm-client = { version = "0.9", optional = true }
tonic = { version = "*", default-features = false, optional = true }
tonic-prost = { version = "*", optional = true }
ed25519-dalek = "2.2.0"
hmac-sha256 = "1.1.12"
base64 = "0.22.1"

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[build-dependencies]
prost-build = "0.14"

[features]
default = ["wasm"]
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen-futures",
    "dep:tonic-web-wasm-client",
    "dep:tonic",
    "dep:tonic-prost",
]
ffi = ["dep:libc"]

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
omit-default-module-path = true

[package.metadata.wasm-pack.profile.profiling.wasm-bindgen]
omit-default-module-path = true

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
omit-default-module-path = true
