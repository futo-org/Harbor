[versions]
agp = "9.4.1"
coroutines = "1.11.0"
wire = "7.1.0"
jna = "5.19.1"
okhttp = "5.3.2"
bouncycastle = "1.86"
junit = "4.13.2"
robolectric = "4.17"
androidx-test = "1.6.1"
# JSON parsing for moderation and JWT tests
orgjson = "20240303"
ktlint = "14.2.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# uniffi-generated Kotlin loads the native library through JNA; the @aar
# classifier ships the Android native bits.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
# ed25519 (Android Keystore has no ed25519 support, keys are app-managed)
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
orgjson = { module = "org.json:json", version.ref = "orgjson" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
