[workspace]
members = [
    "packages/rs-common",
    "packages/rs-core",
    "services/server",
    "services/server/entity",
    "services/server/migration",
    "services/server/tests",
    "services/moderation",
    "services/push-notifications",
    "services/common/*",
    "tools/identity",
]
exclude = ["legacy/"]
resolver = "2"

[workspace.dependencies]
# Internal crates
polycentric-common = { path = "packages/rs-common" }

# Async runtime / service frameworks
tokio = { version = "1.50.0" }
uniffi = { version = "=0.31.0", features = ["tokio"] }
rdkafka = { version = "0.39" }
sea-orm = { version = "2.0.1" }
sea-orm-migration = { version = "2.0.1" }

# Protobuf / gRPC
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"

# Crypto / hashing
ed25519-dalek = "3.0.0"
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"

# Misc shared
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
opentelemetry-prometheus = "0.32"
prometheus = "0.14"
# Pinned: 0.3.48 adds a `From` impl on an associated-type projection that
# fails coherence (E0119) in sea-query and aws-smithy-types. Unpin once those
# crates ship releases that compile against it.
time = "=0.3.55"
base64 = "0.22.1"