[workspace]
members = [
    "packages/rs-common",
    "packages/rs-core",
    "services/server",
    "services/server/entity",
    "services/server/migration",
    "services/server/tests",
]
exclude = ["legacy/"]
resolver = "2"

[workspace.dependencies]
uniffi = { version = "=0.31.0", features = ["tokio"] }